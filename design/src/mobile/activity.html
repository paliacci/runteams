<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunTeams · 活动流</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="rt.css" rel="stylesheet" />
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#282623"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#282623"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#282623"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#282623"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5l2.2-2.3a3.1 3.1 0 00-4.4 0L8 10.5z" fill="#282623"/><path d="M8 6.2a6 6 0 014.3 1.8l1.4-1.5a8 8 0 00-11.4 0l1.4 1.5A6 6 0 018 6.2z" fill="#282623" opacity=".55"/></svg>
      <svg width="25" height="13" viewBox="0 0 25 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#282623" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="18" height="8" rx="1.6" fill="#282623"/><rect x="23" y="4.5" width="1.6" height="4" rx=".8" fill="#282623" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="top">
    <div class="brand"><span class="greet">活动</span></div>
    <div class="avatar">J</div>
  </div>

  <div class="wrap tabbed" style="padding-top:14px">
    <div class="chips">
      <div class="chip on">全部</div>
      <div class="chip"><span class="rd"></span>待你处理 <span class="c">1</span></div>
      <div class="chip">进行中 <span class="c">3</span></div>
      <div class="chip">已完成</div>
    </div>

    <div class="sec-lbl" style="margin-top:2px;color:var(--block)">待你处理</div>
    <div class="row" style="border-color:var(--block)">
      <span class="rdot block"></span>
      <div class="body">
        <div class="r1"><span class="card">潮汐钓鱼时机预测</span></div>
        <div class="r2">需求评审 · 自动重试已停止，等你决定</div>
      </div>
      <span class="meta-r">1h</span>
    </div>

    <div class="sec-lbl">进行中</div>
    <div class="row">
      <span class="rdot run"></span>
      <div class="body">
        <div class="r1"><span class="card">独居老人用药提醒 App</span></div>
        <div class="r2">UI 设计师 · 正在出高保真设计稿</div>
      </div>
      <span class="meta-r">12m</span>
    </div>
    <div class="row">
      <span class="rdot run"></span>
      <div class="body">
        <div class="r1"><span class="card">潮汐钓鱼时机预测</span></div>
        <div class="r2">需求分析师 · 正在梳理 PRD</div>
      </div>
      <span class="meta-r">3m</span>
    </div>
    <div class="row">
      <span class="rdot run"></span>
      <div class="body">
        <div class="r1"><span class="card">城市骑行导航</span></div>
        <div class="r2">ASO 专员 · 正在选词</div>
      </div>
      <span class="meta-r">1m</span>
    </div>

    <div class="sec-lbl">已完成</div>
    <div class="row">
      <span class="rdot ok"></span>
      <div class="body">
        <div class="r1"><span class="card">城市骑行导航</span></div>
        <div class="r2">品牌策划 · 已交付品牌单页</div>
      </div>
      <span class="meta-r">1h</span>
    </div>
    <div class="row">
      <span class="rdot ok"></span>
      <div class="body">
        <div class="r1"><span class="card">城市骑行导航</span></div>
        <div class="r2">立项终审 · 已通过，GO</div>
      </div>
      <span class="meta-r">2h</span>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg><span class="l">首页</span></div>
    <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span class="l">活动</span><span class="tbadge">1</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 4v16"/></svg><span class="l">看板</span></div>
  </div>
</body>
</html>
