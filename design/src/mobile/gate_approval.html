<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunTeams · 人工闸·评审放行</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="rt.css" rel="stylesheet" />
<style>
  .nav{display:flex;align-items:center;height:44px;padding:0 14px;}
  .nav .back{display:flex;align-items:center;gap:2px;color:var(--ink2);font-size:16px;font-weight:500;background:none;border:0;}
  .nav .back svg{width:20px;height:20px;}
  .flag{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;}
  .flag .dot{width:8px;height:8px;border-radius:50%;background:var(--run);box-shadow:0 0 0 4px var(--run-weak);}
  .flag .t{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--run);}
  h1{font-size:30px;line-height:1.16;font-weight:600;letter-spacing:-.021em;margin-bottom:12px;}
  .meta{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sub);margin-bottom:24px;}
  .meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;}
  .card .l{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;}
  .prod{display:flex;align-items:center;gap:12px;}
  .prod .ai{width:38px;height:38px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;}
  .prod .ai svg{width:20px;height:20px;}
  .prod .an{font-size:14.5px;font-weight:500;}
  .prod .am{font-size:12px;color:var(--sub);font-family:var(--mono);margin-top:2px;}
  .card p{font-size:15px;line-height:1.5;color:var(--ink);}
</style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#282623"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#282623"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#282623"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#282623"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5l2.2-2.3a3.1 3.1 0 00-4.4 0L8 10.5z" fill="#282623"/><path d="M8 6.2a6 6 0 014.3 1.8l1.4-1.5a8 8 0 00-11.4 0l1.4 1.5A6 6 0 018 6.2z" fill="#282623" opacity=".55"/></svg>
    <svg width="25" height="13" viewBox="0 0 25 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#282623" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="18" height="8" rx="1.6" fill="#282623"/><rect x="23" y="4.5" width="1.6" height="4" rx=".8" fill="#282623" fill-opacity=".4"/></svg>
  </span></div>

  <div class="nav"><button class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>待你处理</button></div>

  <div class="wrap" style="padding-top:6px">
    <div class="flag"><span class="dot"></span><span class="t">等你放行</span></div>
    <h1>城市骑行导航</h1>
    <div class="meta"><span>提审 · 人工闸</span><span class="sep"></span><span>App 工厂</span></div>

    <div class="card">
      <div class="l">待放行的交付</div>
      <div class="prod">
        <div class="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-4 4 3 5-5 4 3"/><circle cx="9" cy="9" r="1.4"/></svg></div>
        <div><div class="an">6 屏截图 + 图标 + 商店文案</div><div class="am">已过机审 · 待人工终审</div></div>
      </div>
    </div>

    <div class="card">
      <div class="l">放行后会发生什么</div>
      <p>推进 = 提交到 App Store 审核；打回 = 退回上一岗附你的意见，重做这一环。</p>
    </div>

    <div style="height:8px"></div>
    <div class="gactions">
      <button class="btn reject">打回重做</button>
      <button class="btn approve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>放行推进</button>
    </div>
    <div class="hint" style="text-align:center;font-size:12.5px;color:var(--sub);margin-top:14px">放行后，工作会回到你的电脑继续运行。</div>

    <div class="foot" style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:22px;color:var(--faint);font-size:12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>端到端加密 · 命令由本设备签名</div>
  </div>
</body>
</html>
