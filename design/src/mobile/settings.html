<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunTeams · 设置</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="rt.css" rel="stylesheet" />
<style>
  .nav{display:flex;align-items:center;height:44px;padding:0 14px;}
  .nav .back{display:flex;align-items:center;gap:2px;color:var(--ink2);font-size:16px;font-weight:500;background:none;border:0;}
  .nav .back svg{width:20px;height:20px;}
  .page-h{font-size:28px;font-weight:600;letter-spacing:-.022em;padding:4px 4px 20px;}
</style>
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#282623"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#282623"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#282623"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#282623"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5l2.2-2.3a3.1 3.1 0 00-4.4 0L8 10.5z" fill="#282623"/><path d="M8 6.2a6 6 0 014.3 1.8l1.4-1.5a8 8 0 00-11.4 0l1.4 1.5A6 6 0 018 6.2z" fill="#282623" opacity=".55"/></svg>
      <svg width="25" height="13" viewBox="0 0 25 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#282623" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="18" height="8" rx="1.6" fill="#282623"/><rect x="23" y="4.5" width="1.6" height="4" rx=".8" fill="#282623" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="nav"><button class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>概览</button></div>

  <div class="wrap" style="padding-top:2px">
    <div class="page-h">设置</div>

    <div class="pair">
      <span class="pd"></span>
      <div><div class="pt">2 台电脑在线</div><div class="ps">MacBook Pro · Mac mini · 已自动关联</div></div>
    </div>

    <div class="sec-lbl" style="margin-top:0">账号</div>
    <div class="slist">
      <div class="srow"><span class="sk">姓名</span><span class="sv">Joe</span></div>
      <div class="srow"><span class="sk">邮箱</span><span class="sv mono">joe@runteams.ai</span></div>
      <div class="srow"><span class="sk">方案</span><span class="sv">Team</span></div>
    </div>

    <div class="sec-lbl">通知</div>
    <div class="slist">
      <div class="srow">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></span>
        <span class="sk">需要你决定时提醒</span>
        <span class="toggle"></span>
      </div>
      <div class="srow">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <span class="sk">关键进展通知</span>
        <span class="toggle off"></span>
      </div>
    </div>

    <div class="sec-lbl">安全</div>
    <div class="slist">
      <div class="srow"><span class="sk">本设备</span><span class="sv mono">iPhone · 已签名</span></div>
      <div class="srow"><span class="sk">加密方式</span><span class="sv mono">AES-256 · P-256</span></div>
    </div>
  </div>
</body>
</html>
