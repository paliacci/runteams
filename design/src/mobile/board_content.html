<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunTeams · 看板（内容线·压测）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="rt.css" rel="stylesheet" />
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#282623"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#282623"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#282623"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#282623"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5l2.2-2.3a3.1 3.1 0 00-4.4 0L8 10.5z" fill="#282623"/><path d="M8 6.2a6 6 0 014.3 1.8l1.4-1.5a8 8 0 00-11.4 0l1.4 1.5A6 6 0 018 6.2z" fill="#282623" opacity=".55"/></svg>
      <svg width="25" height="13" viewBox="0 0 25 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#282623" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="18" height="8" rx="1.6" fill="#282623"/><rect x="23" y="4.5" width="1.6" height="4" rx=".8" fill="#282623" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="wrap tabbed" style="padding-top:12px">
    <div class="board-head">
      <h1>内容工厂</h1>
      <div class="meta"><span class="mono">snapshot 9107</span><span class="sep"></span><span>8 环节</span><span class="sep"></span><span>3 任务在线</span></div>
    </div>

    <div class="stage-item entry">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">选题箱</span><span class="role">入口</span><span class="badge">4</span></div>
      <div class="stage-empty">4 条待排期</div>
    </div>

    <div class="stage-item active">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">深度研究</span><span class="role">研究员</span><span class="badge">1</span></div>
      <div class="stage-card">
        <span class="cdot run"></span>
        <span class="cn">2025 AI 芯片竞争格局</span>
        <span class="meta-r">运行 8m</span>
      </div>
    </div>

    <div class="stage-item active">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">起草</span><span class="role">撰稿人</span><span class="badge">1</span></div>
      <div class="stage-card">
        <span class="cdot run"></span>
        <span class="cn">远程办公的隐性成本</span>
        <span class="meta-r">运行 21m</span>
      </div>
    </div>

    <div class="stage-item gate needs">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">主编审校</span><span class="role gate"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 4 7 8 9 4-2 8-4 8-9V6z"/></svg>人工闸</span><span class="badge">1</span></div>
      <div class="stage-card needs">
        <span class="cdot block"></span>
        <span class="cn">为什么利率牵动你的房贷</span>
        <span class="tag">需要你</span>
      </div>
    </div>

    <div class="stage-item">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">配图排版</span><span class="role">视觉编辑</span><span class="badge">0</span></div>
      <div class="stage-empty">空闲</div>
    </div>

    <div class="stage-item gate">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">终审发布</span><span class="role gate"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 4 7 8 9 4-2 8-4 8-9V6z"/></svg>人工闸</span><span class="badge">0</span></div>
      <div class="stage-empty">空闲</div>
    </div>

    <div class="stage-item done">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">已发布</span><span class="role">终态</span><span class="badge">12</span></div>
      <div class="stage-empty">本周已发布 12 篇</div>
    </div>

    <div class="stage-item dropped">
      <span class="node"></span><span class="spine"></span>
      <div class="stage-head"><span class="snm">已弃稿</span><span class="role">终态</span><span class="badge">3</span></div>
      <div class="stage-empty">3 篇未通过</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg><span class="l">首页</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span class="l">活动</span><span class="tbadge">1</span></div>
    <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 4v16"/></svg><span class="l">看板</span></div>
  </div>
</body>
</html>
