<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunTeams · 确认终止</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="rt.css" rel="stylesheet" />
</head>
<body>
  <!-- 背景：被压暗的人工闸 -->
  <div class="statusbar"><span>9:41</span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#282623"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#282623"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#282623"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#282623"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5l2.2-2.3a3.1 3.1 0 00-4.4 0L8 10.5z" fill="#282623"/><path d="M8 6.2a6 6 0 014.3 1.8l1.4-1.5a8 8 0 00-11.4 0l1.4 1.5A6 6 0 018 6.2z" fill="#282623" opacity=".55"/></svg>
    <svg width="25" height="13" viewBox="0 0 25 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#282623" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="18" height="8" rx="1.6" fill="#282623"/><rect x="23" y="4.5" width="1.6" height="4" rx=".8" fill="#282623" fill-opacity=".4"/></svg>
  </span></div>
  <div class="wrap" style="padding-top:8px">
    <div style="display:inline-flex;align-items:center;gap:8px;margin-bottom:16px"><span style="width:8px;height:8px;border-radius:50%;background:var(--block);box-shadow:0 0 0 4px var(--block-weak)"></span><span style="font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--block)">需要你决定</span></div>
    <h1 style="font-size:30px;line-height:1.16;font-weight:600;letter-spacing:-.021em;margin-bottom:12px">潮汐钓鱼时机预测</h1>
    <div style="font-size:13px;color:var(--sub);margin-bottom:26px">需求评审 · App 工厂</div>
    <div class="card" style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:14px"><div style="font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin-bottom:9px">为什么停下</div><p style="font-size:15.5px;line-height:1.5;color:var(--ink)">自动重试已达上限（8 次）。用量已达本周上限。</p></div>
  </div>

  <!-- 确认弹层 -->
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>
    <h2>终止这个任务？</h2>
    <p>任务会被移到「已弃」，不再自动运行。此操作无法撤销，但你可以之后重新入列。</p>
    <button class="btn danger">确认终止</button>
    <button class="btn ghost" style="margin-top:10px">再想想</button>
  </div>
</body>
</html>
