<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunTeams · 人工闸</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f2ef; --panel:#ffffff; --ink:#282623; --ink2:#55524c; --sub:#7a766e; --faint:#a6a199;
    --line:#eceae6; --line2:#e3e1dc; --field:#f6f4f1;
    --run:#a9760f; --run-weak:#f4eddb; --ok:#3f7d4e; --block:#bd4a3d; --block-weak:#f6e9e5;
    --sans:"Hanken Grotesk","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sh:0 1px 2px rgba(45,38,25,.045),0 8px 24px rgba(45,38,25,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  html,body{background:var(--bg);}
  body{font-family:var(--sans);color:var(--ink);width:100%;max-width:402px;min-height:874px;margin:0 auto;position:relative;overflow-x:hidden;}

  /* status bar */
  .statusbar{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:-.02em;}
  .statusbar .r{display:flex;gap:7px;align-items:center;opacity:.9;}
  .statusbar svg{display:block;}

  /* nav */
  .nav{display:flex;align-items:center;height:44px;padding:0 14px;}
  .nav .back{display:flex;align-items:center;gap:2px;color:var(--ink2);font-size:16px;font-weight:500;background:none;border:0;cursor:pointer;}
  .nav .back svg{width:20px;height:20px;}

  .wrap{padding:8px 22px 40px;}

  /* status flag */
  .flag{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;}
  .flag .dot{width:8px;height:8px;border-radius:50%;background:var(--block);box-shadow:0 0 0 4px var(--block-weak);}
  .flag .t{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--block);}

  h1{font-size:30px;line-height:1.16;font-weight:600;letter-spacing:-.021em;margin-bottom:12px;}
  .meta{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sub);margin-bottom:26px;}
  .meta .k{font-family:var(--mono);font-weight:500;color:var(--ink2);letter-spacing:-.01em;}
  .meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 19px;box-shadow:var(--sh);margin-bottom:14px;}
  .lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin-bottom:9px;}
  .card p{font-size:15.5px;line-height:1.5;color:var(--ink);letter-spacing:-.006em;}
  .card p .mono{font-family:var(--mono);font-weight:500;font-size:14px;}
  .card p .reset{color:var(--run);font-weight:500;}

  /* stat row */
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;margin-bottom:26px;}
  .stat{padding:16px 8px 15px;text-align:center;position:relative;}
  .stat + .stat::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line2);}
  .stat .n{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--ink);}
  .stat.zero .n{color:var(--faint);}
  .stat .u{font-size:11px;color:var(--sub);margin-top:8px;letter-spacing:.02em;}

  /* actions */
  .btn{width:100%;height:52px;border-radius:14px;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;}
  .btn.primary{background:var(--ink);color:#fdfcfa;}
  .btn.primary svg{width:18px;height:18px;}
  .btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2);margin-top:10px;}
  .hint{text-align:center;font-size:12.5px;color:var(--sub);margin-top:14px;line-height:1.45;}

  /* footer */
  .foot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:24px;color:var(--faint);font-size:12px;letter-spacing:.01em;}
  .foot svg{width:13px;height:13px;}
</style>
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#282623"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#282623"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#282623"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#282623" opacity=".3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5l2.2-2.3a3.1 3.1 0 00-4.4 0L8 10.5z" fill="#282623"/><path d="M8 6.2a6 6 0 014.3 1.8l1.4-1.5a8 8 0 00-11.4 0l1.4 1.5A6 6 0 018 6.2z" fill="#282623" opacity=".55"/></svg>
      <svg width="25" height="13" viewBox="0 0 25 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#282623" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#282623"/><rect x="23" y="4.5" width="1.6" height="4" rx=".8" fill="#282623" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="nav">
    <button class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>待你处理</button>
  </div>

  <div class="wrap">
    <div class="flag"><span class="dot"></span><span class="t">需要你决定</span></div>
    <h1>潮汐钓鱼时机预测</h1>
    <div class="meta"><span class="k">岗位 11</span><span class="sep"></span><span>需求评审</span><span class="sep"></span><span>App 工厂</span></div>

    <div class="card">
      <div class="lbl">为什么停下</div>
      <p>自动重试已达上限（<span class="mono">8</span> 次）。用量已达本周上限，将于<span class="reset"> 今天 16:00 </span>重置<span class="mono"> · America/New_York</span>。</p>
    </div>

    <div class="card">
      <div class="lbl">继续后会发生什么</div>
      <p>检查任务、岗位与渠道状态后，从中断处继续运行 —— 不会重跑已完成的岗位。</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">08</div><div class="u">已尝试</div></div>
      <div class="stat zero"><div class="n">00</div><div class="u">已交付</div></div>
      <div class="stat"><div class="n">1:04</div><div class="u">已等待 · 时</div></div>
    </div>

    <button class="btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>立即重试</button>
    <button class="btn ghost">终止任务</button>
    <div class="hint">重试后，工作会回到你的电脑继续运行。</div>

    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      端到端加密 · 命令由本设备签名
    </div>
  </div>
</body>
</html>
