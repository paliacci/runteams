[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "runteams-core"
version = "0.1.2"
license = "LicenseRef-RunTeams-Source-Available-1.0"
license-files = ["LICENSE", "docs/legal/LICENSING.md", "docs/legal/THIRD_PARTY_DOCUMENTS.md"]
requires-python = ">=3.12"
dependencies = [
  "Pillow==11.3.0",
  "pypdfium2==5.14.0",
  "PyYAML==6.0.3",
  "jsonschema==4.25.1",
  "attrs==26.1.0",
  "jsonschema-specifications==2025.9.1",
  "referencing==0.37.0",
  "rpds-py==2026.9.1",
  "typing_extensions==4.16.0",
  "packaging==26.3"
]

[project.scripts]
runteams-community = "runteams_core.application.community:main"

[tool.setuptools]
py-modules = []
include-package-data = true

[tool.setuptools.packages.find]
include = ["runteams_core*", "runteams_creator_dev*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.js", "*.cjs", "*.css", "*.html", "*.svg", "*.mjs", "*.sh", "*.ts", "*.md"]
