[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "runteams-core"
version = "0.1.2"
license = "LicenseRef-RunTeams-Source-Available-1.0"
license-files = ["LICENSE", "LICENSING.md", "THIRD_PARTY_DOCUMENTS.md"]
requires-python = ">=3.12"
dependencies = [
  "Pillow==11.3.0",
  "pypdfium2==5.14.0",
  "PyYAML==6.0.3",
  "jsonschema==4.25.1",
  "attrs==26.1.0",
  "jsonschema-specifications==2025.9.1",
  "referencing==0.37.0",
  "rpds-py==2026.9.1",
  "typing_extensions==4.16.0",
  "packaging==26.3"
]

[project.scripts]
runteams-community = "runteams_core.community:main"

[tool.setuptools]
py-modules = [
  "adapter_base",
  "adapter_claude",
  "adapter_codex",
  "agent_environment",
  "agent_guidance",
  "agent_interaction",
  "agent_python",
  "agent_stream",
  "agent_tool_registry",
  "agent_tools_mcp",
  "app_secrets",
  "automation_store",
  "bot_context",
  "capability_runtime",
  "chat_attachments",
  "cli_compatibility",
  "cli_discovery",
  "codex_processes",
  "codex_threads",
  "errors",
  "local_database",
  "local_references",
  "model_catalog_display",
  "model_channels",
  "native_document_tools",
  "native_employee_tools",
  "plugin_brands",
  "product_store",
  "provider_catalog",
  "runner",
  "runtime_capabilities",
  "work_environment"
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["runteams_core*", "runteams_creator_dev*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.js", "*.css", "*.html", "*.svg", "*.mjs", "*.sh", "*.ts", "*.md"]
