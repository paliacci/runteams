name: Core source and installed product
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: python -m pip install -r requirements/build.txt -r requirements/runtime.txt
      - run: npm ci --prefix tooling/js --ignore-scripts --no-audit --no-fund
      - run: python -B -m runteams_core.devtools.ci --output "$RUNNER_TEMP/core-ci" --sdk-tsc "$GITHUB_WORKSPACE/tooling/js/node_modules/typescript/lib/tsc.js"
      - name: Test the shared document editor and its Core host
        working-directory: frontend/rich-document
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: core-build
          path: |
            ${{ runner.temp }}/core-ci/wheels/*.whl
            ${{ runner.temp }}/core-ci/verification.json
            ${{ runner.temp }}/core-ci/sdk-clients/*.json
  native-runtime:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p test_process_tree.py
      - run: python -B -m unittest discover -s tests -p test_file_locks.py
      - name: Provision and verify the Windows x64 MCP runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_provision_mcp_node.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $node = python -B -m runteams_core.devtools.provision_mcp_node --cache "$env:RUNNER_TEMP/node-cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix sdk/mcp-host --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $node sdk/mcp-host/build.mjs "$env:RUNNER_TEMP/mcp-host"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m runteams_core.devtools.prepare_mcp_runtime --node $node --host "$env:RUNNER_TEMP/mcp-host" --output "$env:RUNNER_TEMP/mcp-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m runteams_core.devtools.package_mcp_runtime --source "$env:RUNNER_TEMP/mcp-runtime"
