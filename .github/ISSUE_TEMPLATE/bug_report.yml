name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected result and steps to reproduce. Remove credentials and personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and installation method
  - type: textarea
    id: evidence
    attributes:
      label: Relevant error or screenshot
      description: Share only the minimum information needed to reproduce the issue.
