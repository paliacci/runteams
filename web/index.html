async function api(path, method, body){

  if(body) o.body=JSON.stringify(body);
  const r=await fetch(path,o),raw=await r.text();
  if(!raw.trim()){
    if(r.status===404&&path.startsWith("/api/assist/"))throw new Error("当前版本不支持这项操作。请重新打开 RunTeams");
    throw new Error("RunTeams 本地服务没有响应。请重新打开应用");
  }
  try{return JSON.parse(raw);}catch(e){throw new Error("本地服务返回异常，请重新打开 RunTeams.ai");}
}
async function streamApi(path,body,onEvent){

  if(!response.ok){let data={};try{data=await response.json();}catch(e){}throw new Error(data.error||"助手没有开始处理。请检查本地服务后再试");}
  if(!response.body)throw new Error("当前浏览器无法接收实时进度，请更新浏览器后重试");

  if(buffer.trim()){try{onEvent(JSON.parse(buffer));}catch(e){}}
}

  const d=openDialog({className:"modal-confirm",title,showClose:false,body:`<div class="modal-copy">${esc(msg)}</div>`,footer:`<div class="grow"></div><button class="btn" onclick="closeModal()">取消</button><button class="btn ${danger?'danger':'pri'}" id="_ok">${esc(actionLabel)}</button>`});
  d.querySelector("#_ok").onclick=()=>{ closeModal(); onOk&&onOk(); };
}
function inputModal(opts, onOk){
  const d=openDialog({className:`modal-input ${opts.variant==="rename"?"modal-rename":""}`,title:opts.title,subtitle:opts.sub,body:`<div class="field"><label>${esc(opts.label||"名称")}</label><input class="inp" id="_v1" placeholder="${esc(opts.ph1||"")}" value="${esc(opts.v1||"")}"></div>${opts.label2?`<div class="field"><label>${esc(opts.label2)}</label><textarea class="ta" id="_v2" placeholder="${esc(opts.ph2||"")}">${esc(opts.v2||"")}</textarea></div>`:""}`,footer:`<div class="grow"></div><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" id="_ok">${esc(opts.ok||"保存")}</button>`});
  const i1=d.querySelector("#_v1"); i1.focus(); i1.select&&i1.select();

async function boot(){

    const [core,mc,cl,bl]=await Promise.all([api("/api/core/board-overview"),api("/api/channels"),api("/api/chats"),api("/api/bots")]);

    const supplemental=[

/* 阅读器：全屏读一份文档。文档名、血缘面包屑、目录和正文，外加导出兜底。 */
function docFromArtifact(artifact,context={}){
  const meta=artifact?.meta_json||{};
  const path=String(meta.path||artifact?.name||""),suffix=path.toLowerCase().slice(path.lastIndexOf("."));
  const contentModel=String(meta.content_model||
    (DOC_MARKDOWN_SUFFIXES.includes(suffix)?"markdown":DOC_TABLE_SUFFIXES.includes(suffix)?"table":""));
  return {id:Number(artifact?.id),name:String(artifact?.name||"产物"),path,
    size:Number(meta.size)||0,created_at:artifact?.created_at||"",
    content_model:contentModel,editable:["markdown","table"].includes(contentModel),
    task_title:context.task_title||"",pipeline_name:context.pipeline_name||"",
    position_name:context.position_name||"",employee_name:context.employee_name||"",
    pipeline_id:Number(context.pipeline_id)||0,workflow_id:Number(context.workflow_id)||0,
    source:String(meta.source||context.source||"employee"),
    document_key:String(meta.document_key||context.document_key||""),
    data_view:meta.data_view||context.data_view||null};
}
async function openDocumentReaderById(id,options={}){
  const numericId=Number(id);
  if(!Number.isInteger(numericId)||numericId<=0)return false;
  let doc=docsById(numericId);
  if(!doc){
    try{
      const response=await fetch(`/api/core/documents/${numericId}`,{cache:"no-store"});
      if(!response.ok)throw new Error("文档不存在或已移到垃圾箱");
      const detail=await response.json();
      if(detail?.error)throw new Error(detail.error);
      doc=detail;
    }catch(error){toast(error.message||"文档没有打开","err");return false;}
  }
  S.docVersionsOpen=false;
  await openDocumentReader(doc,{preserveStack:options.preserveStack===true,route:options.route!==false,replace:options.replace===true,anchor:options.anchor||""});
  return true;
}   // 从列表进来的是"换一份文档"，历史版本回到收起
function documentReaderCrumbs(doc){
  const position=String(doc.position_name||"").trim(),employee=String(doc.employee_name||"").trim();

async function openDocumentReader(doc,options={}){

  leaveConversationModeForPage();
  if(!options.preserveStack)S.docReaderStack=[];
  // 先把页面切到文档区再挂阅读器：render() 见到「不在文档页却有阅读器」会主动收尾

  S.docReader={doc,text:"",revisions:[],editing:doc.task_input?false:docEditable(doc)&&doc.is_current_revision!==false,draft:"",status:"loading",saveStatus:"saved",saveError:"",anchor:String(options.anchor||"")};

}

/* 首个一级标题即文档标题：标题区显示它，正文里就不再重复渲染一次。 */
function documentTitleParts(){
  const state=S.docReader,fallback={title:state?.doc?.name||"",body:state?.text||"",fromBody:false};
  if(!state||state.status!=="ready")return fallback;
  // 只有 Markdown 自身拥有标题语义；其它格式保留原始内容并按自己的模型预览。
  if(docKind(state.doc)!=="markdown")return fallback;
  const markdown=String(state.text||"");
  const match=markdown.match(/^\s*#\s+(.+?)\s*(?:\n|$)/);
  if(!match)return {title:fallback.title,body:markdown,fromBody:false};
  return {title:match[1],body:markdown.slice(match[0].length),fromBody:true};
}
/* 正文从状态渲染：页面按 HTML 字符串重绘，异步塞进去的内容会被冲掉。 */
function documentReaderContentMarkup(){
  const state=S.docReader;
  if(!state)return "";
  const doc=state.doc,kind=docKind(doc),url=docContentUrl(doc);
  if(kind==="image")return `<div class="doc-reader-media ${S.docImageActual?"actual":"fit"}" id="doc_reader_media"><div class="doc-reader-media-bar"><button type="button" class="${S.docImageActual?"":"on"}" onclick="setDocumentImageScale(false)">适应窗口</button><button type="button" class="${S.docImageActual?"on":""}" onclick="setDocumentImageScale(true)">原始大小</button></div><div class="doc-reader-media-stage"><img src="${url}" alt="${esc(doc.name)}"></div></div>`;
  if(kind==="pdf"||kind==="html")return `<div class="doc-reader-frame"><iframe src="${url}" title="${esc(doc.name)}" sandbox></iframe></div>`;
  if(kind==="binary")return `<div class="doc-reader-empty">${ICON("info")}<b>这类文件不能在产品内阅读</b><span>用「更多 → 用系统应用打开」交给系统，或者导出到别的位置。</span></div>`;
  if(state.status==="error")return `<div class="doc-reader-empty">${ICON("info")}<b>文档没有打开</b><span>${esc(state.error||"请稍后重试")}</span></div>`;
  if(state.status!=="ready")return `<div class="doc-reader-loading"><span class="env-spinner"></span><span>正在打开文档…</span></div>`;
  const liveView=documentDataViewMarkup(doc);
  if(kind==="json")return `${documentJsonMarkup(state.text,`document-${Number(doc.id)||"input"}`)}${liveView}`;
  if(kind==="table")return `${state.editing?documentTableEditorMarkup(state):documentTableMarkup(state.text,docSuffix(doc)===".tsv"?"\t":",")}${liveView}`;
  if(kind==="text")return `<pre class="doc-reader-code">${esc(String(state.text||""))}</pre>${liveView}`;

  if(state.editing)return `<div class="doc-reader-prose is-live" id="doc_editor_host"></div>${liveView}`;
  return `<div class="doc-reader-prose">${renderMarkdown(String(state.text||""))}</div>${liveView}`;

/* 编辑器用 Milkdown（ProseMirror 内核，见 frontend/doc-editor）。
   自己写 contenteditable 试过一轮：光标锚点、回车拆块、原生命令静默失灵，
   全是这类编辑器十年前就解决掉的问题，不该重造。这里只做挂载和 markdown 进出。 */
let _docEditor=null;
// v2 uses ProseMirror block anchors; v1 stored DOM-child indexes and could
// restore formatting onto the following block when widgets were present.
const DOC_BLOCK_STYLES_KEY="runteams_doc_block_styles_v2";
function documentStyleBucketKeys(docOrId){
  const numericId=(typeof docOrId==="object"?Number(docOrId?.id):Number(docOrId))
    ||Number(new URLSearchParams(location.search).get("document")||0);
  const doc=typeof docOrId==="object"?docOrId:(S.docReader?.doc&&Number(S.docReader.doc.id)===numericId?S.docReader.doc:null);
  const stable=String(doc?.document_key||"").trim();
  return [...new Set([stable?`key:${stable}`:"",numericId?String(numericId):""].filter(Boolean))];
}
function documentBlockStyles(docOrId){
  const doc=docOrId&&typeof docOrId==="object"?docOrId:null;
  // The document service is authoritative.  Keeping the read synchronous
  // lets the editor mount without a flash; document_detail already includes
  // editor_styles in the same response as the Markdown body.
  if(doc&&doc.editor_styles&&typeof doc.editor_styles==="object")return {...doc.editor_styles};
  try{
    // One-time compatibility read for documents styled by the old client.
    // New writes never go back to localStorage; the next style command moves
    // the value into the document revision on the server.
    const all=JSON.parse(localStorage.getItem(DOC_BLOCK_STYLES_KEY)||"{}");
    return documentStyleBucketKeys(docOrId).reduce((merged,key)=>Object.assign(merged,all[key]||{}),{});
  }catch(error){return {};}
}
let _documentStyleSaveQueue=Promise.resolve();
function saveDocumentBlockStyle(docId,style){
  const resolvedId=Number(docId)||Number(new URLSearchParams(location.search).get("document")||0);
  if(!resolvedId||!style?.anchor)return;
  const doc=S.docReader?.doc&&Number(S.docReader.doc.id)===resolvedId?S.docReader.doc:null;
  const styles=doc?.editor_styles&&typeof doc.editor_styles==="object"?doc.editor_styles:{};
  const value={...(styles[style.anchor]||{})};
  if(style.align!=null)value.align=style.align||"left";
  if(style.indent!=null)value.indent=Number(style.indent)||0;
  if(style.color!=null)value.color=style.color||"";
  if(style.background!=null)value.background=style.background||"";
  if(doc){
    doc.editor_styles={...styles,[style.anchor]:value};
    if(style.signature&&!/^DIV\|/.test(style.signature))doc.editor_styles[`sig:${style.signature}`]={...value};
  }
  // Serialize style writes per document.  Multi-row commands can return many
  // targets; a small queue prevents concurrent read-modify-write requests
  // from dropping one another's metadata.
  _documentStyleSaveQueue=_documentStyleSaveQueue.then(async()=>{
    const result=await api(`/api/core/artifacts/${resolvedId}/styles`,"POST",{style});
    if(doc&&result?.styles&&typeof result.styles==="object")doc.editor_styles=result.styles;
  }).catch(()=>{});
}
// The editor controller owns all live formatting. The host keeps only the
// persistence adapter above; it must never scan or rewrite ProseMirror DOM.
function documentReaderAssignStaticAnchors(){
  const prose=document.querySelector(".doc-reader-content .doc-reader-prose:not(.is-live)");
  if(!prose)return;
  [...prose.children].forEach((node,index)=>{
    node.dataset.runteamsAnchor=`block-${index}`;
    [...node.querySelectorAll?.(":scope > ol > li, :scope > ul > li")||[]].forEach((item,itemIndex)=>{
      const target=item.querySelector?.(":scope > p, :scope > h1, :scope > h2, :scope > h3, :scope > pre")||item;
      target.dataset.runteamsAnchor=`block-${index}-${itemIndex}`;
    });
  });
}

  navigator.clipboard.writeText(String(value||"")).then(()=>toast(success,"ok")).catch(()=>toast(failure,"err"));
}

  if(!state||!_docEditor)return "";
  const body=_docEditor.getMarkdown();
  const titleEl=document.getElementById("doc_paper_title");
  const title=titleEl?String(titleEl.textContent||"").trim():"";
  if(state.titleFromBody&&title)return `# ${title}\n\n${body.replace(/^\s+/,"")}`;
  return body;
}
/* 自动保存：停手 1.2 秒后写回。同一次编辑合并进同一个版本，交接出去之后才开新版本。 */
let _docAutosaveTimer=null;
function scheduleDocumentAutosave(){
  clearTimeout(_docAutosaveTimer);
  _docAutosaveTimer=setTimeout(()=>{_docAutosaveTimer=null;saveDocumentEdit();},1200);
}
/* 还在防抖里等着的那次保存立刻发出去：草稿是同步取的，此时编辑器必须还活着 */
function flushDocumentAutosave(){
  if(!_docAutosaveTimer)return;
  clearTimeout(_docAutosaveTimer);
  _docAutosaveTimer=null;
  saveDocumentEdit();
}
async function saveDocumentEdit(){
  const state=S.docReader;
  if(!state||!state.editing)return;
  if(_docSaveInFlight){state.saveQueued=true;return;}
  const draft=docKind(state.doc)==="table"?documentTableDraft(state):documentDraftMarkdown();
  if(!draft.trim())return;
  const baseline=String(state.text||"");
  if(draft===baseline)return;
  state.saveStatus="saving";state.saveError="";documentReaderSyncSaveUI();
  const docId=Number(state.doc.id);
  const request=(async()=>{
    try{
      const result=await api(`/api/core/artifacts/${docId}/content`,"POST",{content:draft});
      if(result.error)throw new Error(result.error);
      if(!S.docReader||Number(S.docReader.doc.id)!==docId)return;
      const currentDraft=docKind(S.docReader.doc)==="table"?documentTableDraft(S.docReader):documentDraftMarkdown();
      S.docReader.text=draft;
      S.docReader.saveStatus=currentDraft===draft?"saved":"saving";
      S.docReader.saveError="";
      if(docKind(S.docReader.doc)==="table"){
        S.docReader.tableDirty=currentDraft!==draft;
        S.docReader.tableSource=draft;
      }
      S.docReader.doc={...S.docReader.doc,id:Number(result.id)||S.docReader.doc.id,path:result.path||S.docReader.doc.path};
      S.docReader.revisions=result.revisions||S.docReader.revisions;
      documentReaderSyncRevisionUI();
      documentReaderOutline();
      await refreshDocuments();
    }catch(error){
      if(S.docReader&&Number(S.docReader.doc.id)===docId){S.docReader.saveStatus="error";S.docReader.saveError=error.message||"保存失败";documentReaderSyncSaveUI();toast(S.docReader.saveError,"err");}
    }finally{
      _docSaveInFlight=null;
      if(S.docReader?.saveQueued){
        S.docReader.saveQueued=false;
        const latest=docKind(S.docReader.doc)==="table"?documentTableDraft(S.docReader):documentDraftMarkdown();
        if(latest!==String(S.docReader.text||""))saveDocumentEdit();
      }
    }
  })();
  _docSaveInFlight=request;
  await request;
}

async function navigateDocumentInternal(id){
  const targetId=Number(id),current=S.docReader;
  if(!current||!Number.isInteger(targetId)||targetId<=0)return;
  if(Number(current.doc?.id)===targetId)return;
  // 先把当前编辑内容落盘，再把来源压入阅读器栈；返回时只需重新读取这一版。
  flushDocumentAutosave();
  const previousUrl=location.pathname+location.search;
  S.docReaderStack.push({doc:{...current.doc},url:previousUrl});
  setAppUrl(routeWithRailState(documentInternalLinkHref(targetId),currentRailRouteValue()),false);
  const opened=await openDocumentReaderById(targetId,{preserveStack:true});
  if(!opened){
    S.docReaderStack.pop();
    setAppUrl(previousUrl,true);
  }
}
async function trashDocumentFromReader(){
  const doc=S.docReader?.doc;
  if(!doc)return;
  const result=await api(`/api/core/artifacts/${Number(doc.id)}/trash`,"POST",{});
  if(result.error)return toast(result.error,"err");
  S.docReaderStack=[];
  closeDocumentReader();
  await refreshDocuments();
  if(S.surface==="docs")docsRenderList();
  toast("已移到垃圾箱，30 天内可以恢复","ok");
}
function closeDocumentReader(){
  if(!S.docReader)return;
  const origin=S.docReaderOrigin;
  if(origin){
    S.docReaderOrigin=null;
    teardownDocumentReader();
    openCorePipeline(origin.pipelineId,{route:false}).then(()=>{if(origin.workflowId)openCoreWorkflow(origin.workflowId);setAppUrl(origin.url,true);render();});
    return;
  }
  const previous=S.docReaderStack.pop();
  if(previous){
    teardownDocumentReader();
    setAppUrl(previous.url||routeWithRailState("/docs"),true);
    openDocumentReader(previous.doc,{preserveStack:true});
    return;
  }
  if(new URLSearchParams(location.search).has("document"))setAppUrl(routeWithRailState("/docs"),true);
  teardownDocumentReader();
  render();
}

function parseDelimitedText(text,separator){
  const source=String(text??""),rows=[],row=[],sep=String(separator||",");let cell="",quoted=false;
  for(let index=0;index<source.length;index++){
    const char=source[index];
    if(quoted){
      if(char==='"'&&source[index+1]==='"'){cell+='"';index++;}
      else if(char==='"')quoted=false;
      else cell+=char;
      continue;
    }
    if(char==='"'&&cell===""){quoted=true;continue;}
    if(source.startsWith(sep,index)){row.push(cell);cell="";index+=sep.length-1;continue;}
    if(char==='\n'||char==='\r'){
      if(char==='\r'&&source[index+1]==='\n')index++;
      row.push(cell);rows.push(row.splice(0));cell="";continue;
    }
    cell+=char;
  }
  if(cell!==""||row.length) {row.push(cell);rows.push(row.splice(0));}
  return rows;
}
function tableRowsForState(state){
  const separator=docSuffix(state?.doc)===".tsv"?"\t":",";
  const source=String(state?.text||"");
  if(!state.tableDirty&&(state.tableSource!==source||!Array.isArray(state.tableRows))){
    state.tableRows=parseDelimitedText(source,separator).map(row=>row.slice());
    state.tableSource=source;
  }
  return state.tableRows;
}
function serializeDelimitedRows(rows,separator){
  const sep=String(separator||",");
  const quote=value=>{const text=String(value??"");return /[\"\r\n]/.test(text)||text.includes(sep)||/^\s|\s$/.test(text)?`"${text.replace(/"/g,'""')}"`:text;};
  return (rows||[]).map(row=>(row||[]).map(quote).join(sep)).join("\n")+(rows?.length?"\n":"");
}
function documentTableDraft(state){
  const separator=docSuffix(state?.doc)===".tsv"?"\t":",";
  return serializeDelimitedRows(tableRowsForState(state),separator);
}
function documentTableCellInput(event){
  const state=S.docReader,cell=event.currentTarget;if(!state||!cell)return;
  const row=Number(cell.dataset.row),column=Number(cell.dataset.col),rows=tableRowsForState(state);
  while(rows.length<=row)rows.push([]);
  while(rows[row].length<=column)rows[row].push("");
  rows[row][column]=cell.value;state.tableDirty=true;
  scheduleDocumentAutosave();
}
function documentTableAddRow(){
  const state=S.docReader;if(!state)return;const rows=tableRowsForState(state),width=Math.max(1,...rows.map(row=>row.length));
  rows.push(Array.from({length:width},()=>""));state.tableDirty=true;documentReaderRenderContent();scheduleDocumentAutosave();
  requestAnimationFrame(()=>document.querySelector(".doc-table-cell[data-row='"+(rows.length-1)+"']")?.focus());
}
function documentTableAddColumn(){

}
function documentTableEditorMarkup(state){

  const body=filled.map((row,rowIndex)=>{const values=Array.from({length:width},(_,column)=>row[column]??"");return `<tr>${values.map((value,column)=>cell(value,rowIndex,column,rowIndex===0)).join("")}<td class="doc-table-row-number" aria-hidden="true">${rowIndex+1}</td></tr>`;}).join("");

}
function documentTableMarkup(text,separator){
  const rows=parseDelimitedText(text,separator).slice(0,5000);
  if(!rows.length)return `<p class="doc-reader-empty">这份表格是空的。</p>`;
  const width=Math.max(1,...rows.map(row=>row.length)),head=rows[0]||[],body=rows.slice(1);
  const values=row=>Array.from({length:width},(_,index)=>esc(row[index]??"")).map(cell=>`<td>${cell}</td>`).join("");
  return `<div class="doc-reader-table-wrap"><table class="doc-reader-table"><thead><tr>${Array.from({length:width},(_,index)=>`<th>${esc(head[index]??"")}</th>`).join("")}</tr></thead><tbody>${body.map(row=>`<tr>${values(row)}</tr>`).join("")}</tbody></table></div>`;
}

async function loadDocumentReader(doc,openSequence=_documentOpenSequence){
  const state=S.docReader;
  if(!state||openSequence!==_documentOpenSequence)return;
  if(["image","pdf","html","binary"].includes(docKind(doc))){
    state.status="ready";documentReaderRenderContent();return;
  }
  if(doc.task_input){
    try{
      const response=doc.inline_content!=null?null:await fetch(docContentUrl(doc),{cache:"no-store"});
      if(response&&!response.ok)throw new Error("附件内容没有取到");
      const detail=response?await response.text():String(doc.inline_content||"");
      if(!S.docReader||openSequence!==_documentOpenSequence||S.docReader.doc!==doc)return;
      S.docReader.text=detail;S.docReader.status="ready";S.docReader.error="";
    }catch(error){if(openSequence!==_documentOpenSequence||S.docReader?.doc!==doc)return;state.status="error";state.error=error.message||"附件内容没有取到";}
    documentReaderRenderContent();
    return;
  }
  try{
    const response=await fetch(`/api/core/documents/${Number(doc.id)}`,{cache:"no-store"});
    if(!response.ok)throw new Error("文档内容没有取到");
    const detail=await response.json();
    if(detail?.error)throw new Error(detail.error);
    if(!S.docReader||openSequence!==_documentOpenSequence||Number(S.docReader.doc.id)!==Number(doc.id))return;
    S.docReader.doc={...S.docReader.doc,...detail};
    S.docReader.text=String(detail.content||"");S.docReader.status="ready";S.docReader.error="";
    if(S.docReader.editing)S.docReader.draft=S.docReader.text;   // 打开即编辑：正文到位后灌进草稿
  }catch(error){
    if(!S.docReader||openSequence!==_documentOpenSequence||Number(S.docReader.doc.id)!==Number(doc.id))return;
    S.docReader.status="error";S.docReader.error=error.message||"请稍后重试";
  }
  documentReaderRenderContent();
}
/* 只重画正文区，避免整屏重绘打断阅读位置；正文本身来自状态，重绘也不会丢。 */
/* 文档结尾若是代码块/表格/引用，就没有可落笔的地方，敲字会掉进那个块里。
   补一个尾部空段落，和常见编辑器一致。 */
function documentReaderRenderContent(){
  const head=document.getElementById("doc_paper_head");
  if(head)head.innerHTML=documentPaperHeadMarkup();   // 标题要等正文到位才能从首行解析出来

  if(barTitle)barTitle.textContent=documentTitleParts().title;
  const target=document.getElementById("doc_reader_content");
  if(target)target.innerHTML=documentReaderContentMarkup();
  const stale=document.getElementById("doc_reader_stale");
  if(stale)stale.innerHTML=documentReaderStaleMarkup();
  documentReaderOutline();
  documentReaderSyncRevisionUI();
  mountDocumentEditor();
  documentReaderAssignStaticAnchors();
  const anchor=S.docReader?.anchor;
  if(anchor)requestAnimationFrame(()=>documentReaderJumpAnchor(anchor));
}
function documentReaderOutline(){
  const outline=document.getElementById("doc_reader_outline"),content=document.getElementById("doc_reader_content");
  if(!outline||!content)return;
  const layout=document.querySelector(".doc-reader-layout");
  const headings=[...content.querySelectorAll("h1,h2,h3")].filter(item=>String(item.textContent||"").trim());   // 空标题在目录里只是一条空行，没有导航价值
  if(headings.length<2){outline.innerHTML="";outline.classList.remove("open");layout?.classList.toggle("is-outline-collapsed",!!S.docOutlineCollapsed);return;}
  outline.classList.add("open");

    if(!heading.id)heading.id=`doc-heading-${index}`;
    return `<button type="button" class="doc-outline-link level-${heading.tagName.toLowerCase()}" data-target="${heading.id}" onclick="documentReaderJump('${heading.id}')">${esc(heading.textContent||"")}</button>`;
  }).join("");
  const title=documentTitleParts().title,collapsed=!!S.docOutlineCollapsed;
  layout?.classList.toggle("is-outline-collapsed",collapsed);
  outline.classList.toggle("is-collapsed",collapsed);
  const label=collapsed?"展开目录":"收起目录";
  const toggle=`<div class="doc-outline-top"><button type="button" class="detail-panel-collapse" title="${label}" aria-label="${label}" aria-expanded="${!collapsed}" onclick="toggleDocumentOutline()">${ICON(collapsed?"chevrons-right":"chevrons-left")}</button></div>`;
  outline.innerHTML=`${toggle}<button type="button" class="doc-side-head" title="${esc(title)}" onclick="documentReaderJumpTop()">${esc(title)}</button>${links}`;
  bindDocumentOutlineSpy(headings);
}
/* 目录跟随阅读位置高亮：滚动时把当前章节标出来。 */
function bindDocumentOutlineSpy(headings){
  const page=documentReaderScroller();
  if(!page)return;
  const sync=()=>{
    const frame=page.getBoundingClientRect(),top=frame.top+72;
    // 还没滚到第一个小标题时 active 为空，亮的是文档标题那一行
    let active=null;
    headings.forEach(heading=>{if(heading.getBoundingClientRect().top<=top)active=heading;});

function coreDeliverablesToText(items){
  return (items||[]).map(item=>{
    const parts=[String(item.path||"")];
    const name=String(item.name||"");
    if(name&&name!==String(item.path||"").split("/").pop())parts.push(name);
    if(item.required===false){if(parts.length===1)parts.push(String(item.path||"").split("/").pop());parts.push("可选");}
    return parts.join(" | ");
  }).join("\n");
}
function coreDeliverablesFromText(text){
  return coreLines(text).map(line=>{
    const parts=line.split("|").map(part=>part.trim()).filter(part=>part.length);
    const path=parts.shift()||"";
    let required=true;
    if(parts.length&&["可选","optional"].includes(parts[parts.length-1])){required=false;parts.pop();}
    return {path,name:parts.join(" | ")||path.split("/").pop(),required};
  }).filter(item=>item.path);
}

async function confirmPlan(surface,index){

  const documentChanged=(m.plan.actions||[]).some(action=>action&&
    (action.op==="create_document"||action.op==="update_document"));
  m.pending="applying";render();
  try{
    if(Number(m.uiTestApplyDelayMs)>0)await new Promise(resolve=>setTimeout(resolve,Number(m.uiTestApplyDelayMs)));
    const out=await api("/api/chat/"+ctx.chatId+"/apply-plan","POST",{message_id:m.id});
    if(out&&out.error)throw new Error(out.error);

    await refreshCoreTeam();
    if(documentChanged)await refreshDocuments();

    if(focusPipeline&&(surface==="chat"||createsPipeline)){S.chatMode="";await openCorePipeline(focusPipeline);toast(createsPipeline?"流水线已创建":"更改已应用","ok");return;}
  }catch(e){m.pending=true;toast((e&&e.message)||"更改没有应用，请检查方案后重试","err");}

}

const CONVERSATION_CONTEXT_TYPES=new Set(["general","pipeline","worker","standard","card","automation"]);
function normalizedConversationContext(session={}){
  const context={...(session.context||{})},kind=session.kind||"general",scopePipelineId=session.scope_pipeline_id||context.pipeline_id||null;
  let type=CONVERSATION_CONTEXT_TYPES.has(context.context_type)?context.context_type:"";
  if(!type){
    if(kind==="employee_design")type="worker";
    else if(kind==="automation")type="automation";
    else if(context.intent==="pipeline-create"||scopePipelineId!=null&&scopePipelineId!=="")type="pipeline";
    else if(context.mode_title==="创建自动化")type="automation";
    else type="general";
  }
  let intent=String(context.intent||"").trim();
  if(intent==="pipeline-create")intent="create";
  if(!intent){
    if(type==="pipeline")intent=scopePipelineId!=null&&scopePipelineId!==""?"manage":"create";
    else if(type==="worker")intent=context.mode_title&&/修复/.test(context.mode_title)?"repair":context.target_worker_id||context.worker_id?"edit":"create";
    else if(type==="standard")intent=context.skill_id?"edit":"create";
    else if(type==="card")intent="edit";
    else if(type==="automation")intent=kind==="automation"?"run":"create";
    else intent="general";
  }
  return {...context,context_type:type,intent};
}
function conversationContext(panel=S.conversationPanel){return normalizedConversationContext(panel||{});}
function conversationContextType(panel=S.conversationPanel){return conversationContext(panel).context_type;}

function conversationMessageGalleryGroups(){
  const groups=[
    {key:"messages",label:"基础消息",description:"文本、附件与发送状态",messages:[]},
    {key:"execution",label:"执行过程",description:"等待、运行与完成状态",messages:[]},
    {key:"decision",label:"交互决策",description:"需要选择、确认与应用",messages:[]},
    {key:"result",label:"结果反馈",description:"检查、变更与结构化结果",messages:[]},
  ];
  const byLabel=text=>{
    const value=String(text||"");
    if(value.startsWith("用户"))return groups[0];
    if(/等待响应|正在执行|流式回复|完成回复|已停止|执行失败/.test(value))return groups[1];
    if(/需要选择|需要确认|正在应用/.test(value))return groups[2];
    return groups[3];
  };
  let current=groups[0],sampleLabel="";
  conversationMessageGallery().forEach(item=>{
    if(item.role==="debug"){
      current=byLabel(item.text);sampleLabel=String(item.text||"").replace(/^(用户|助手)\s*·\s*/,"");
      return;
    }
    current.messages.push({...item,debugLabel:sampleLabel});
  });
  return groups.filter(group=>group.messages.length);
}

async function openBotConversation(employeeId=0){
  employeeId=Number(employeeId)||0;
  const employee=(S.coreEmployees||[]).find(item=>Number(item.id)===employeeId);
  if(!employee)return toast("这个 Bot 已不存在","err");
  const label=String(employee.name||"未命名员工");
  const current=S.conversationPanel;captureConversationPanelDraft();rememberConversationPanel(current);
  const cached=S.conversationPanelsByWorkspace[`worker:${employeeId}:chat`];
  const stored=botListConversation(employeeId);
  // Bot 入口本身就是对话入口，先锁定模式，避免工作区恢复期间短暂回到团队首页。
  S.railMode="assistant";S._pendingRailMode="";S.railCollapsed=false;
  if(cached&&!cached.loading){S.conversationPanel=cached;hostConversationInRail(cached,{save:false});render();syncRailRoute(currentRailRouteValue(),true);}
  else if(stored&&stored.conversation_id!=null)await openRailConversationSession(stored.conversation_id,{forceWorkspace:true,replace:true});
  else await newRailChat({scopePipelineId:null,forceWorkspace:true,context:{context_type:"worker",intent:"chat",target_employee_id:employeeId,worker_name:label,label}});
  // newRailChat 通过下一帧切换模式；Bots 入口要等这个切换真正完成后再结束，
  // 避免打开流水线的异步刷新把主区停留在首页。
  if(activeRailMode()!=="assistant")await setRailMode("assistant");
  // 工作区恢复可能在这期间触发一次异步 render，最后再把 Bots 入口钉回统一对话主区。
  if(activeRailMode()!=="assistant"){S.railMode="assistant";S._pendingRailMode="";S.railCollapsed=false;saveRailLayout();render();syncRailRoute(currentRailRouteValue(),true);}
  if(S.conversationPanel){
    S.conversationPanel.context={...(S.conversationPanel.context||{}),context_type:"worker",target_employee_id:employeeId,worker_name:label,label};
  }
  // Bot 对话本身也是一个可切换的工作窗口；在对话面板完成恢复后登记，
  // 避免先登记为流水线窗口而导致多窗口 header 缺少当前 Bot。
  workspaceEnsureCurrent();
  render();
}

  const d=openChildDialog({className:'workspace-reset-modal',title:'永久清空工作区',subtitle:'此操作不可撤销',closeOnScrim:false,body:`<div class="workspace-reset-warning"><b>将永久删除</b><ul><li>所有可执行技能、员工、流水线和任务</li><li>员工设计对话、运行记录、交付文件和对应工作目录</li></ul><small>账号、普通对话、自动化、模型渠道和全局凭据会保留。</small></div><div class="field workspace-reset-field"><label for="workspace_reset_confirmation">请输入 <strong>${phrase}</strong> 继续</label><input class="inp" id="workspace_reset_confirmation" autocomplete="off" spellcheck="false"></div>`,footer:`<div class="grow"></div><button class="btn" onclick="closeChildDialog()">取消</button><button class="btn danger" id="workspace_reset_submit" disabled>永久清空</button>`});

    const confirmation=input.value.trim();
    if(confirmation!==phrase){toast('请输入“清空工作区”确认','err');input.focus();return;}

function channelUsageFor(channelId){return (S.channelUsage&&Array.isArray(S.channelUsage.channels)?S.channelUsage.channels:[]).find(item=>String(item.channel_id)===String(channelId))||null;}
function channelRemainingLabel(value){if(value===null||value===undefined||String(value).trim()==="")return "";const numeric=Number(value);return Number.isFinite(numeric)?`剩余 ${Math.round(numeric)}%`:"";}

function channelUsageSummary(channel,ready){
  if(!ready)return "";
  const usage=channelUsageFor(channel.id);
  // Keep the connected card quiet while the quota request is in flight.
  // The account menu follows the same rule; render the summary only once a
  // concrete result (or an actionable error) is available.
  if(!usage&&S.channelUsageLoading)return "";
  if(!usage)return S.channelUsage?.error?`<span class="channel-usage-inline unavailable">暂不可用</span>`:"";
  const label=channelRemainingLabel(usage.remaining_percent)||"暂不可用";
  const resetAt=channelUsageDateTime(usage.resets_at);
  return `<span class="channel-usage-inline ${usage.status==='ready'?'ready':'unavailable'}"><span>${esc(label)}</span>${resetAt?`<span class="channel-usage-reset">重置</span><span>${esc(resetAt)}</span>`:""}</span>`;
}
function renderChannels(loading){
  const cards=S.channels.map(c=>{
    const p=c.probe||{}; const checking=!!(c.enabled&&loading&&!c.probe); const ready=!!(c.enabled&&p.status==="ready");
    const state=c.connecting?"正在检测…":(checking?"正在检测…":(ready?"已连接":(c.loginPending?"等待终端登录":(!c.enabled?"未连接":(p.status==="missing"?"尚未安装":(p.status==="error"?"连接遇到问题":"未连接"))))));
    const accountParts=p.account&&ready?String(p.account).split(/\s*·\s*/).map(value=>value.trim()).filter(Boolean):[];
    const action=(checking||c.connecting)?"":(ready
      ? `<button class="channel-remove" title="仅从 RunTeams.ai 移除，不退出对应渠道" aria-label="移除 ${esc(c.provider_label)}" onclick="removeChannel(${c.id})">移除</button>`
      : c.loginPending?`<button class="btn sm channel-connect" onclick="checkChannelLogin(${c.id})">重新检测</button>`:`<button class="btn sm channel-connect" onclick="connectChannel(${c.id})">连接</button>`),loginHelp=c.loginPending&&!ready?`<div class="channel-login-help"><p>请在你自己的终端登录 ${esc(c.provider_label||c.name)}，然后返回这里。</p><div><code>${esc(c.login_command||"")}</code><button type="button" onclick="copyChannelLoginCommand(${c.id})">复制命令</button></div></div>`:"";

      <div class="channel-logo ${tone}">${logo}</div>
      <div class="channel-main"><div class="channel-name"><span class="channel-name-label">${esc(c.provider_label||c.name)}</span>${usageSummary}</div>
        <div class="channel-state ${ready?'ready':'warn'}"><span class="channel-state-status">${esc(state)}</span>${accountParts.map(value=>`<span class="channel-state-detail">${esc(value)}</span>`).join("")}</div></div>
      ${action?`<div class="channel-actions ${ready?'channel-actions-overlay':''}">${action}</div>`:''}
      ${loginHelp}
    </div>`;
  }).join("");

    list.innerHTML=cards||'<div class="empty">还没有连接模型渠道</div>';

  if(_channelsNested)openChildDialog(dialog);else openDialog(dialog);

async function connectChannel(id){
  const c=S.channels.find(x=>x.id===id);if(!c)return;c.connecting=true;renderChannels(false);
  try{
    const r=await api("/api/channel/"+id+"/connect","POST");if(r.error)throw new Error(r.error);
    if(r.channel)Object.assign(c,r.channel);c.connecting=false;
    if(c.probe&&c.probe.status==="ready"){await refreshEnvironment();await refreshModelCatalog(true);render();if(document.getElementById("channel_list"))renderChannels(false);toast(c.provider_label+" 已连接","ok");continueAfterAgentSetup(c);return;}
    if(r.requires_login){c.loginPending=true;c.connecting=false;if(document.getElementById("channel_list"))renderChannels(false);toast(`请在终端登录 ${c.provider_label||c.name}，返回后会自动检测`,"info");pollChannelLogin(id);return;}
    if(document.getElementById("channel_list"))renderChannels(false);
  }catch(e){c.connecting=false;if(document.getElementById("channel_list"))renderChannels(false);toast(e.message||"模型渠道没有连接。请先在终端完成登录","err");}
}
async function copyChannelLoginCommand(id){const c=S.channels.find(x=>x.id===id),command=c&&c.login_command||"";if(!command)return;try{await navigator.clipboard.writeText(command);toast("登录命令已复制","ok");}catch(e){toast("无法复制，请手动选择登录命令","err");}}
async function checkChannelLogin(id){const c=S.channels.find(x=>x.id===id);if(!c||c.connecting)return;c.connecting=true;renderChannels(false);const ready=await probeChannelLoginState(id);c.connecting=false;if(document.getElementById("channel_list"))renderChannels(false);if(!ready)toast(`还没有检测到 ${c.provider_label||c.name} 登录`,"info");}
async function probeChannelLoginState(id){
  const c=S.channels.find(x=>x.id===id);if(!c||c.loginProbeBusy)return !!(c&&c.probe&&c.probe.status==="ready");
  const wasReady=!!(c.probe&&c.probe.status==="ready"),wasPending=!!c.loginPending;c.loginProbeBusy=true;
  try{
    const r=await api("/api/channel/"+id+"/probe","POST");if(r.channel)Object.assign(c,r.channel);
    const ready=!!(c.probe&&c.probe.status==="ready");
    if(ready){c.connecting=false;c.loginPending=false;}else if(!c.loginPending)c.connecting=false;
    if(document.getElementById("channel_list"))renderChannels(false);
    if(ready&&!wasReady){await Promise.allSettled([refreshEnvironment(),refreshModelCatalog(true)]);render();if(document.getElementById("channel_list"))renderChannels(false);}
    if(ready&&wasPending){toast(c.provider_label+" 已连接","ok");continueAfterAgentSetup(c);}
    return ready;
  }catch(e){return false;}finally{c.loginProbeBusy=false;}
}
function refreshPendingChannelLogins(){(S.channels||[]).filter(c=>c.loginPending).forEach(c=>probeChannelLoginState(c.id));}
function refreshOpenChannelStatuses(){(S.channels||[]).filter(c=>c.enabled).forEach(c=>probeChannelLoginState(c.id));}
async function pollChannelLogin(id){
  const c=S.channels.find(x=>x.id===id);if(!c)return;
  if(c.loginPolling)return;c.loginPolling=true;
  for(let i=0;i<150&&c.loginPending;i++){
    await new Promise(resolve=>setTimeout(resolve,2000));
    if(await probeChannelLoginState(id))break;
  }
  c.loginPolling=false;if(c.loginPending){c.loginPending=false;c.connecting=false;}if(document.getElementById("channel_list"))renderChannels(false);
}
async function removeChannel(id){
  const c=S.channels.find(x=>x.id===id);if(!c)return;
  const r=await api("/api/channel/"+id+"/remove","POST");if(r.error){toast(r.error,"err");return;}
  if(r.channel)Object.assign(c,r.channel);c.probe=null;c.connecting=false;markEnvironmentChannelDisconnected(id);normalizeConversationModelConfig(S.chatCfg);const panels=new Set([S.conversationPanel,...Object.values(S.conversationPanelsByWorkspace||{}),...Object.values(S.conversationPanelsByChat||{})].filter(Boolean));panels.forEach(normalizeConversationModelConfig);render();refreshPersistentAgentWarnings();if(document.getElementById("channel_list"))renderChannels(false);refreshEnvironmentAfterChannelChange();
  toast(`${c.provider_label||c.name} 已断开；对话会自动切换可用模型，员工和自动化不会自动换模型。`,"info");
}






function closeDrawer(){++_detailOpenSequence;if(S.surface==="environment"){S.environmentDetail=null;setAppUrl(environmentRoute(null));}else{if(S.surface==="core-pipeline"&&S.sel?.type==="core-employee-run")setAppUrl(corePipelineRoute(Number(S.corePipeline?.id)));S.sel=null;}render();}
let _detailOpenSequence=0;




function draftRuntimeConfig(){
  const base=S.chatCfg||defaultChatConfig(railConversationPipelineId()),channel=S.channels.find(c=>String(c.id)===String(base&&base.channel_id));
  if(!channel||!channel.enabled)return base||{};
  const model=effectiveModelValue(channel,base.model||""),reasoning_effort=normalizedEffort(channel,model,base.reasoning_effort||"");
  return {channel_id:channel.id,model,reasoning_effort};
}

function workerModelItems(channelId,model){const items=[];S.channels.filter(c=>modelChannelAvailable(c)||String(c.id)===String(channelId)).forEach(c=>{const current=String(c.id)===String(channelId),available=modelChannelAvailable(c),cur=current?model:effectiveModelValue(c,""),catalog=modelItems(c,cur).filter(item=>item.value);let models=available?catalog:(current&&model?catalog.filter(item=>String(item.value)===String(model)):[]);if(current&&model&&!models.some(item=>String(item.value)===String(model)))models=[{value:model,label:model},...models];items.push({head:true,label:(c.provider_label||c.name)+(available?"":" · 当前不可用"),provider:c.provider});models.forEach(m=>items.push({value:String(c.id)+"::"+m.value,label:m.label+(available?"":"（不可用）")}));});return items;}
function workerRouteValue(channelId,model){return channelId!=null?String(channelId)+"::"+(model||""):"";}

let _corePipelineDragId=null;

function corePipelineDrop(event,targetId){event.preventDefault();targetId=Number(targetId);if(_corePipelineDragId==null||_corePipelineDragId===targetId)return;const dragPinned=railPipelinePinned(_corePipelineDragId),targetPinned=railPipelinePinned(targetId);if(dragPinned!==targetPinned){toast("置顶与普通流水线请分别排序","info");return;}if(dragPinned){const ids=[...S.railPinnedPipelines],from=ids.indexOf(_corePipelineDragId),to=ids.indexOf(targetId);if(from<0||to<0)return;ids.splice(to,0,ids.splice(from,1)[0]);S.railPinnedPipelines=ids;saveRailPinnedPipelines();render();return;}const ids=railOrderedCorePipelines().filter(item=>!railPipelinePinned(item.id)).map(item=>Number(item.id)),from=ids.indexOf(_corePipelineDragId),to=ids.indexOf(targetId);if(from<0||to<0)return;ids.splice(to,0,ids.splice(from,1)[0]);S.railPipelineOrder=ids;saveRailPipelineOrder();render();}
