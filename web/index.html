<div class="app" id="app"></div>
<!-- runteams-host-components -->
<script>
window.RunTeamsBoot=(()=>{
  const WORKSPACE_WINDOWS_BOOT_KEY="runteams_workspace_windows_v1";
  let navigationWindows=[];
  const line=(cls="")=>'<span class="skeleton-block '+cls+'"></span>';
  const heading=(action)=>'<div class="environment-title skeleton-page-heading"><div class="skeleton-heading-copy">'+line("sk-page-title")+line("sk-page-subtitle")+'</div>'+(action||"")+'</div>';
  const extensionRow=()=>'<div class="environment-cap-row skeleton-extension-row" data-skeleton-row inert>'+line("sk-glyph")+'<span class="environment-row-main skeleton-card-copy">'+line("sk-name")+line("sk-copy wide")+'</span>'+line("sk-status")+'</div>';
  const docsRow=()=>'<div class="docs-row skeleton-docs-row" data-skeleton-row inert><span class="docs-cell docs-cell-title">'+line("sk-doc-title")+'</span><span class="docs-cell docs-cell-editor">'+line("sk-doc-editor")+'</span><span class="docs-cell docs-cell-time">'+line("sk-doc-time")+'</span><span class="docs-cell docs-cell-more">'+line("sk-doc-more")+'</span></div>';
  const automationRow=()=>'<div class="automation-row skeleton-automation-row" data-skeleton-row inert>'+line("sk-automation-state")+'<span class="automation-row-copy skeleton-card-copy">'+line("sk-name")+line("sk-copy")+'</span>'+line("sk-doc-more")+'</div>';
  const trashRow=()=>'<div class="trash-list-row skeleton-trash-row" data-skeleton-row inert><div class="trash-list-main">'+line("sk-trash-icon")+'<span class="trash-list-copy skeleton-card-copy">'+line("sk-name")+line("sk-copy short")+'</span></div><span class="trash-list-lifecycle skeleton-card-copy">'+line("sk-doc-time")+line("sk-meta")+'</span><span class="trash-list-actions">'+line("sk-trash-action")+'</span></div>';
  function guidanceSkeleton(){
    const card='<div class="conversation-work-example guidance-skeleton-card"><span><i class="skeleton-block guidance-skeleton-card-title"></i><i class="skeleton-block guidance-skeleton-card-copy"></i><i class="skeleton-block guidance-skeleton-card-material"></i></span><i class="skeleton-block guidance-skeleton-card-arrow"></i></div>';
    return '<div class="conversation-empty-state conversation-employee-guidance guidance-skeleton" role="status" aria-label="正在读取员工信息…"><div class="skeleton-block guidance-skeleton-title"></div><div class="skeleton-block guidance-skeleton-subtitle"></div><div class="conversation-work-examples" aria-hidden="true">'+card.repeat(3)+'</div></div>';
  }
  const pipelineColumn=(index)=>'<div class="col skeleton-column column-color-gray"><div class="col-surface"><div class="chd">'+line(index===0?"sk-name short":"sk-name")+line("sk-count")+'</div><div class="lane">'+Array.from({length:index===0?2:3},()=>'<div class="skeleton-task">'+line("sk-copy wide")+line("sk-copy")+line("sk-meta")+'</div>').join("")+'</div></div></div>';
  function normalizeKind(value){return RunTeamsSkeletons.normalize(value);}
  function kindFromLocation(){return RunTeamsSkeletons.fromLocation();}
  function pageSkeleton(value){
    const kind=normalizeKind(value||kindFromLocation());
    if(kind==="pipeline-new")return RunTeamsStaticPages.page(kind);
    return RunTeamsSkeletons.wrap(kind,RunTeamsSkeletons.page(kind)||pageSkeletonMarkup(kind));
  }
  function pageSkeletonMarkup(value){
    const kind=normalizeKind(value||kindFromLocation());

    if(kind==="conversation"||kind==="employee-examples"){
      const body=kind==="employee-examples"?'<div class="conversation-messages is-empty">'+guidanceSkeleton()+'</div>':RunTeamsSkeletons.region('conversation-messages');
      return '<main class="conversation-workspace-main conversation-page-skeleton" aria-busy="true"><div class="conversation-main-frame"><section class="rail-assistant conversation-main"><header class="conversation-panel-header"><span class="conversation-panel-context-icon">'+line("sk-glyph")+'</span><span class="conversation-panel-heading"><span class="skeleton-block sk-conversation-title"></span><span class="skeleton-block sk-conversation-context"></span></span>'+RunTeamsSkeletons.conversationHeaderActions()+'</header><div class="conversation-scroll-shell"><div class="rail-assistant-scroll">'+body+'</div></div><div class="rail-assistant-input">'+RunTeamsStaticPages.composer()+'</div></section></div></main>';
    }
    if(kind==="docs")return '<div class="page-skeleton environment-page docs-page list-page skeleton-environment-page"><div class="environment-content docs-content list-page-content"><div class="environment-title environment-extension-header docs-head list-page-header list-page-header--controls skeleton-page-heading"><div class="environment-extension-heading list-page-heading"><div class="skeleton-extension-title-row">'+line("sk-page-title")+'</div>'+line("sk-page-subtitle")+'</div><div class="environment-catalog-actions docs-actions list-page-controls">'+line("sk-search-control")+'</div></div><div class="docs-body"><div class="docs-table"><div class="docs-thead"><span class="docs-cell docs-cell-title">'+line("sk-doc-heading")+'</span><span class="docs-cell docs-cell-editor">'+line("sk-doc-heading short")+'</span><span class="docs-cell docs-cell-time">'+line("sk-doc-heading short")+'</span><span></span></div>'+Array.from({length:4},docsRow).join("")+'</div></div></div></div>';
    if(kind==="automations")return '<div class="page-skeleton environment-page automation-page skeleton-environment-page"><div class="environment-content">'+heading(line("sk-page-action"))+'<div class="automation-toolbar">'+line("sk-automation-search")+'<div class="skeleton-automation-filters">'+line("sk-filter")+line("sk-filter short")+line("sk-filter short")+'</div></div><div class="automation-list">'+Array.from({length:4},automationRow).join("")+'</div></div></div>';
    if(kind==="trash")return '<div class="page-skeleton environment-page trash-page list-page skeleton-trash-page skeleton-environment-page"><div class="environment-content trash-content"><div class="environment-title trash-skeleton-head list-page-header skeleton-page-heading"><div class="environment-extension-heading trash-head-copy">'+line("sk-page-title")+line("sk-page-subtitle")+'</div></div><div class="trash-toolbar">'+line("sk-meta")+'</div><section class="trash-list-wrap"><div class="trash-list-columns"><span>'+line("sk-doc-heading")+'</span><span>'+line("sk-doc-heading short")+'</span><span>'+line("sk-doc-heading short")+'</span></div><div class="trash-list">'+Array.from({length:4},trashRow).join("")+'</div></section></div></div>';
    return '<div class="page-skeleton pipeline-skeleton"><div class="vhead skeleton-pipeline-head">'+line("sk-pipeline-title")+'<span class="grow"></span>'+line("sk-run")+line("sk-button")+line("sk-button")+line("sk-button")+'</div><div class="board skeleton-board"><div class="cols">'+Array.from({length:4},(_,index)=>pipelineColumn(index)).join("")+'</div></div></div>';
  }
  function railSkeleton(navTab="team"){
    const botRows=(count)=>Array.from({length:count},()=>'<div class="bot-list-row boot-bot-row" data-skeleton-row inert><span class="boot-bot-avatar">'+line("sk-bot-avatar")+'</span><span class="bot-list-copy skeleton-card-copy"><span class="bot-list-head">'+line("sk-name")+line("sk-bot-time")+'</span>'+line("sk-copy wide")+'</span></div>').join("");
    const kind=kindFromLocation(),selected=kind==='conversation-new'?'新对话':['docs','document-reader'].includes(kind)?'文档':['pipeline','pipeline-new'].includes(kind)?'流水线':kind==='trash'?'垃圾箱':'';
    const link=(label,href,icon)=>'<a class="rail-primary-action'+(label===selected?' on':'')+'" aria-current="'+(label===selected?'page':'false')+'" href="'+href.replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))+'"><svg class="i" aria-hidden="true"><use href="#i-'+icon+'"></use></svg><span>'+label+'</span></a>';
    const teamBody='<div class="rail-actions">'+link('新对话','/chats/new','message-circle-plus')+'</div><div class="railmid-shell"><div class="railmid boot-rail-mid"><div class="rail-nav-primary">'+link('文档','/documents','doc')+RunTeamsHost.shell.navigation('boot').map(item=>link(item.label,item.href,item.icon)).join('')+link('流水线','/pipelines/new','flow')+'</div><section class="rail-section pipeline-sec boot-rail-section" aria-label="流水线与会话" aria-busy="true"></section><nav class="rail-trash-navigation" aria-label="垃圾箱">'+link('垃圾箱','/trash','trash')+'</nav></div></div>';
    const botsBody='<div class="bot-list-shell boot-bot-list-shell"><label class="bot-list-search rt-search-field rt-search-field--compact"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" aria-label="搜索全部员工" placeholder="搜索员工" disabled></label><div class="bot-list" role="status" aria-label="正在读取员工列表" aria-busy="true"><div aria-hidden="true">'+botRows(6)+'</div></div></div>';
    const body=navTab==="bots"?botsBody:teamBody;
    const icon=name=>'<svg class="i" aria-hidden="true"><use href="#i-'+name+'"></use></svg>';
    return '<aside class="rail boot-rail" id="rgRail" data-mode="navigation">'+RunTeamsShell.topActions(icon,'',{pending:true})+'<div class="rail-fixed"><div class="railtop rail-mode-top boot-mode-top">'+RunTeamsShell.modeTabs(navTab,icon,'RunTeamsBoot.selectRailTab')+'</div></div><div class="rail-content-viewport"><div class="rail-content-track"><div class="rail-mode-pane rail-navigation-pane">'+body+RunTeamsShell.footer({account:RunTeamsShell.accountEntry({loading:true,icon})})+'</div></div></div></aside>';
  }

  
  function selectRailTab(value){
    const tab=value==='bots'?'bots':'team';
    try{const layout=JSON.parse(localStorage.getItem('runteams_sidebar_layout_v1')||'{}')||{};localStorage.setItem('runteams_sidebar_layout_v1',JSON.stringify({...layout,navTab:tab}));}catch(error){}
    RunTeamsBoot.railTabChanged?.(tab);
    const rail=document.getElementById('rgRail');if(!rail?.classList.contains('boot-rail'))return;
    const footer=rail.querySelector('.railfoot-wrap'),template=document.createElement('template');
    template.innerHTML=railSkeleton(tab);const next=template.content.firstElementChild;
    if(footer)next.querySelector('.railfoot-wrap')?.replaceWith(footer);
    rail.replaceWith(next);
    next.querySelector(`[data-rail-tab="${tab}"]`)?.focus({preventScroll:true});
  }

  function savedWindowScope(){const supplied=RunTeamsHost.workspace.savedScope();if(supplied!==undefined)return supplied;const id=document.querySelector?.('meta[name="runteams-library-id"]')?.content;return /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(id||'')?id:null;}
  function savedWorkspaceWindows(scope=savedWindowScope()){
    const supplied=RunTeamsHost.workspace.savedWindows(scope);if(supplied!==undefined)return supplied;
    if(!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(scope||''))return [];
    try{if(JSON.parse(localStorage.getItem('runteams_device_display_v1')||'{}')?.restore_windows===false)return [];
      const raw=localStorage.getItem(`runteams.library.v1:${scope}:${WORKSPACE_WINDOWS_BOOT_KEY}`);if(!raw||raw.length>65536)return [];
      const seen=new Set();return (JSON.parse(raw)||[]).filter(row=>{if(!row||typeof row.key!=='string'||row.key.length>160||seen.has(row.key)||typeof row.route!=='string'||row.route.length>2048||!row.route.startsWith('/')||row.route.startsWith('//'))return false;
       const url=new URL(row.route,location.origin);if(url.origin!==location.origin)return false;seen.add(row.key);return true;});
    }catch(error){return [];}
  }
  function windowDisplay(key){const supplied=RunTeamsHost.shell.windowDisplay(key);if(supplied)return supplied;
    if(key.startsWith('worker:'))return {title:'员工对话',icon:'user'};
    
    if(key.startsWith('pipeline:')||key.startsWith('pipeline-local:'))return {title:key==='pipeline:draft'?'新建流水线':'流水线',icon:'flow'};
    if(key.startsWith('document:')||key==='docs:list')return {title:'文档',icon:'doc'};
    if(key.startsWith('chat:'))return {title:key.startsWith('chat:new')?'新对话':'对话',icon:'square-pen'};
    return ({trash:{title:'垃圾箱',icon:'trash'},'design-system':{title:'设计系统',icon:'spark'}})[key]||{title:'工作区',icon:'square-pen'};
  }
  function revealPendingTab(){
    const tab=document.querySelector?.('#rgWorkspaceTabs .workspace-tab.on'),scroller=tab?.closest('.workspace-tabs-scroll');if(!scroller)return;
    const item=tab.getBoundingClientRect(),viewport=scroller.getBoundingClientRect();
    if(item.left<viewport.left)scroller.scrollLeft+=item.left-viewport.left;
    else if(item.right>viewport.right)scroller.scrollLeft+=item.right-viewport.right;
  }
  function pendingTabsMarkup(options={}){
    navigationWindows=[];
    const kind=kindFromLocation(),origin=location.origin||'http://localhost',current=new URL(location.href||location.pathname+(location.search||''),origin);
    const scope=Object.prototype.hasOwnProperty.call(options,'scope')?options.scope:savedWindowScope();
    const device=/^[0-9a-f]{64}$/.test(scope||''),library=/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(scope||'');
    if(kind==='conversation'&&!device&&!library)return '<div class="workspace-tabs" aria-hidden="true"></div>';
    let rows=savedWorkspaceWindows(scope);navigationWindows=rows;
    const sameRoute=row=>{const url=new URL(RunTeamsRoutes.unmount(row.route),origin);url.searchParams.sort();const target=new URL(RunTeamsRoutes.unmount(current.href),origin);target.searchParams.sort();return url.pathname===target.pathname&&url.search===target.search;};
    const currentKey=RunTeamsHost.shell.windowKey(kind)??(kind==='conversation-new'&&current.searchParams.get('purpose')==='create-employee'?'chat:new:create-employee':({'pipeline-new':'pipeline:draft','conversation-new':'chat:new',docs:'docs:list',trash:'trash','design-system':'design-system'})[kind]);
    let active=rows.find(row=>row.key===currentKey)||rows.find(sameRoute),added=false;
    if(!active){added=true;active={key:currentKey||'boot:'+current.pathname+current.search,route:current.pathname+current.search,title:RunTeamsStaticPages.title(kind)};rows=[...rows.slice(-7),active];}
    rows=rows.map(row=>({...row,...windowDisplay(row.key),title:(library||device||options.verified)&&row.title?row.title:row===active&&added&&!currentKey?RunTeamsStaticPages.title(kind):windowDisplay(row.key).title}));
    if(typeof requestAnimationFrame==='function')requestAnimationFrame(revealPendingTab);
    return RunTeamsShell.windowTabs(rows,active.key,RunTeamsStaticPages.icon,row=>{
      const src=String(row.iconImage||'');
      return /^\/(?:worker-avatars\/bottts\/[a-z0-9-]+\.svg|ui\/avatars\/[a-z0-9-]+\.svg|api\/worker-avatar\/upload\/[a-f0-9]{64}\.webp)$/.test(src)?`<span class="av has-image"><img src="${src}" alt=""></span>`:RunTeamsStaticPages.icon(row.icon);
    },{pending:true});
  }
  function tabsSkeleton(options={}){return '<div id="rgWorkspaceTabs">'+pendingTabsMarkup(options)+'</div>';}

  function railNavTab(){
    try{return JSON.parse(localStorage.getItem("runteams_sidebar_layout_v1")||"{}").navTab==="bots"?"bots":"team";}catch(error){return "team";}
  }
  function render(){
    if(RunTeamsHost.lifecycle.initial())return;
    let layout={};try{layout=JSON.parse(localStorage.getItem('runteams_sidebar_layout_v1')||'{}')||{};}catch(error){}
    const collapsed=!!layout.collapsed,width=collapsed?0:RunTeamsLayout["rail-width"];
    const navTab=layout.navTab==='bots'?'bots':'team';
    const kind=kindFromLocation(),content=pagePending(kind),tabs=tabsSkeleton();
    const app=document.getElementById("app"),composer=RunTeamsStaticPages.captureComposer(app);
    app.innerHTML='<div class="body product-shell boot-body '+(collapsed?'rail-collapsed ':'')+(kind==='conversation'?'conversation-chrome-pending':'')+'" data-workspace-tabs-empty="false" style="grid-template-columns:'+width+'px 1fr 0">'+railSkeleton(navTab)+tabs+'<div class="mid" id="rgMid">'+content+'</div><div id="rgDrawer"></div></div>';
    RunTeamsStaticPages.restoreComposer(composer,app);
  }
  function pagePending(value,options={}){return RunTeamsStaticPages.page(value||kindFromLocation(),{...options,desktop:true});}
  return {normalizeKind,kindFromLocation,pageSkeleton,pagePending,pageSkeletonMarkup,railSkeleton,selectRailTab,render,guidanceSkeleton,tabsSkeleton,pendingTabsMarkup,savedWorkspaceWindows,railNavTab};
})();


function designSystemMain(){
  const theme=document.documentElement.dataset.theme||"system";
  return `<main class="design-system-page">
    <header class="design-system-head"><div><span class="design-system-kicker">Internal UI reference</span><h1>RunTeams 设计系统</h1><p>所有产品控件必须从这里继承颜色、边框、层级和交互状态。</p></div><div class="seg2 design-theme-switch"><button class="${theme==="light"?'on':''}" onclick="setDesignSystemTheme('light')">浅色</button><button class="${theme==="dark"?'on':''}" onclick="setDesignSystemTheme('dark')">深色</button><button class="${theme==="system"?'on':''}" onclick="setDesignSystemTheme('system')">跟随系统</button></div></header>

async function openSidebarWork(id,options={}){
  if(requestDetailWorkspaceLeave(()=>openSidebarWork(id,options)))return;
  const sequence=++_sidebarWorkOpenSequence,scope=workspaceAccountCacheToken(),generation=_workspaceBusinessGeneration,source=location.href;
  const current=()=>sequence===_sidebarWorkOpenSequence&&scope===workspaceAccountCacheToken()&&generation===_workspaceBusinessGeneration&&RunTeamsHost.session.ready(S);

    if(options.storage_scope==='device'&&RunTeamsHost.session.workspace(S))throw Error('请在个人工作区查看这项本机工作。');
    const workflow=await api(`/api/${options.storage_scope==='device'?'device/work':'core'}/workflows/${Number(id)}`);
    if(!current()||location.href!==source)return;
    if(workflow.error||Number(workflow.id)!==Number(id)||workflow.task?.trashed_at)throw Error(workflow.error||'任务已不可用');
    if(options.storage_scope==='device'&&workflow.storage_scope!=='device')throw Error('本机工作暂时无法读取。');
    const reference=workflow.snapshot_json?.pipeline_work?.reference;
    if(reference){
      await RunTeamsSourcePipelines.openFromLink(RunTeamsSourcePipelines.route(reference));
      const active=RunTeamsSourcePipelines.current();
      if(current()&&active?.reference?.source_id===reference.source_id&&active.reference.pipeline_source===reference.pipeline_source)await RunTeamsSourcePipelines.openWork(Number(id));
      return;
    }
    if(workflow.storage_scope==='device'){
      const chatId=Number(workflow.snapshot_json?.source?.chat_id)||0;
      if(chatId)await openRailConversationSession(chatId,{forceWorkspace:true});
      if(!current())return;
    }else throw Error('任务所属的员工或流水线暂不可用');
    const url=appRouteLocation();url.searchParams.set('workflow',String(id));setAppUrl(url.pathname+url.search+url.hash,true);
    replaceCoreWorkflowLocal(workflow);await openCoreWorkflow(Number(id));

}

/* 后端给的时间戳可能带不带时区两种写法，统一按 UTC 解析 */
function docParseTime(value){
  if(!value)return null;
  const raw=String(value).trim();
  const normalized=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw)?raw:(raw.includes("T")?raw+"Z":raw.replace(" ","T")+"Z");
  const date=new Date(normalized);
  return Number.isNaN(date.getTime())?null:date;
}
function docsTime(value){
  const date=docParseTime(value);
  if(!date)return "";
  const clock=`${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`;
  const days=docDayDistance(value);
  if(days===0)return `今天 ${clock}`;
  if(days===1)return `昨天 ${clock}`;
  return `${date.getMonth()+1}月${date.getDate()}日 ${clock}`;
}

async function refreshContextResults(preserveExisting=false){

  const selection=S.sel,sequence=++_contextResultsSequence,scopeToken=workspaceAccountCacheToken(),current=()=>S.sel===selection&&sequence===_contextResultsSequence&&scopeToken===workspaceAccountCacheToken();

    const scope=selection.scope,query=scope.employee_reference?'employee_reference='+encodeURIComponent(JSON.stringify(scope.employee_reference)):scope.employee_id?`employee_id=${scope.employee_id}`:scope.workflow_id?`workflow_id=${scope.workflow_id}`:`pipeline_id=${scope.pipeline_id}`;

    if(data.error)throw new Error(data.error);

    selection.data=data;

      const owner=results.find(r=>r.references?.some(ref=>ref.key===S.workItemSelected));
      if(owner)selection.resultKey=owner.key;

async function saveDocumentTableEdit(){
  const state=S.docReader;
  if(!state||!state.editing||docKind(state.doc)!=="table")return;
  if(_documentTableSaveInFlight){state.saveQueued=true;return;}
  const draft=documentTableDraft(state);
  if(!draft.trim())return;
  const baseline=String(state.text||"");
  if(draft===baseline)return;
  state.saveStatus="saving";state.saveError="";documentReaderSyncSaveUI();
  const docId=Number(state.doc.id);
  const request=(async()=>{
    try{
      const result=await api(`/api/core/artifacts/${docId}/content`,"POST",{content:draft});
      if(result.error)throw new Error(result.error);
      if(!S.docReader||Number(S.docReader.doc.id)!==docId)return;
      const currentDraft=documentTableDraft(S.docReader);
      S.docReader.text=draft;
      S.docReader.saveStatus=currentDraft===draft?"saved":"saving";
      S.docReader.saveError="";
      S.docReader.tableDirty=currentDraft!==draft;
      S.docReader.tableSource=draft;
      S.docReader.doc={...S.docReader.doc,id:Number(result.id)||S.docReader.doc.id,path:result.path||S.docReader.doc.path};
      S.docReader.revisions=result.revisions||S.docReader.revisions;
      documentReaderSyncRevisionUI();
      documentReaderOutline();
      await refreshDocumentReaderSource(state);
    }catch(error){
      if(S.docReader&&Number(S.docReader.doc.id)===docId){S.docReader.saveStatus="error";S.docReader.saveError=error.message||"保存失败";documentReaderSyncSaveUI();toast("更改尚未保存，可在文档设置中重试。","err");}
    }finally{
      _documentTableSaveInFlight=null;
      if(S.docReader?.saveQueued){
        S.docReader.saveQueued=false;
        const latest=documentTableDraft(S.docReader);
        if(latest!==String(S.docReader.text||""))saveDocumentTableEdit();
      }
    }
  })();
  _documentTableSaveInFlight=request;
  await request;
}

    waitingDialog=openDialog({className:"modal-confirm",title:"正在保存文档",showClose:false,

function parseDelimitedText(text,separator){
  const source=String(text??""),rows=[],row=[],sep=String(separator||",");let cell="",quoted=false;
  for(let index=0;index<source.length;index++){
    const char=source[index];
    if(quoted){
      if(char==='"'&&source[index+1]==='"'){cell+='"';index++;}
      else if(char==='"')quoted=false;
      else cell+=char;
      continue;
    }
    if(char==='"'&&cell===""){quoted=true;continue;}
    if(source.startsWith(sep,index)){row.push(cell);cell="";index+=sep.length-1;continue;}
    if(char==='\n'||char==='\r'){
      if(char==='\r'&&source[index+1]==='\n')index++;
      row.push(cell);rows.push(row.splice(0));cell="";continue;
    }
    cell+=char;
  }
  if(cell!==""||row.length) {row.push(cell);rows.push(row.splice(0));}
  return rows;
}
function tableRowsForState(state){
  const separator=docSuffix(state?.doc)===".tsv"?"\t":",";
  const source=String(state?.text||"");
  if(!state.tableDirty&&(state.tableSource!==source||!Array.isArray(state.tableRows))){
    state.tableRows=parseDelimitedText(source,separator).map(row=>row.slice());
    state.tableSource=source;
  }
  return state.tableRows;
}
function serializeDelimitedRows(rows,separator){
  const sep=String(separator||",");
  const quote=value=>{const text=String(value??"");return /[\"\r\n]/.test(text)||text.includes(sep)||/^\s|\s$/.test(text)?`"${text.replace(/"/g,'""')}"`:text;};
  return (rows||[]).map(row=>(row||[]).map(quote).join(sep)).join("\n")+(rows?.length?"\n":"");
}
function documentTableDraft(state){
  const separator=docSuffix(state?.doc)===".tsv"?"\t":",";
  return serializeDelimitedRows(tableRowsForState(state),separator);
}
function documentTableCellInput(event){

}

async function loadDocumentReader(doc,openSequence=_documentOpenSequence,preloaded=null){

  }
  if(doc.task_input||doc.work_artifact){

      const response=doc.inline_content!=null?null:await fetch(docContentUrl(doc),{cache:"no-store"});
      if(response&&!response.ok)throw new Error("附件内容没有取到");
      const detail=response?await response.text():String(doc.inline_content||"");
      if(!S.docReader||openSequence!==_documentOpenSequence||S.docReader.doc!==doc)return;
      S.docReader.text=detail;S.docReader.status="ready";S.docReader.error="";
    }catch(error){if(openSequence!==_documentOpenSequence||S.docReader?.doc!==doc)return;state.status="error";state.error=error.message||"附件内容没有取到";}
    documentReaderRenderContent();
    return;
  }
  try{

    const local=!preloaded&&deviceWorkPath(path)!==path;
    const response=preloaded||local?null:await fetch(path,{cache:"no-store"});
    if(response&&!response.ok)throw new Error("文档内容没有取到");
    const detail=preloaded||(local?await api(path):await response.json());

    else if(detail.editable===false)S.docReader.editing=false;

  }catch(error){
    if(!S.docReader||openSequence!==_documentOpenSequence||Number(S.docReader.doc.id)!==Number(doc.id))return;

/* 目录跟随阅读位置高亮：滚动时把当前章节标出来。 */
function bindDocumentOutlineSpy(headings){
  const page=documentReaderScroller();
  if(!page)return;
  const sync=()=>{
    const frame=page.getBoundingClientRect(),top=frame.top+72;
    // 还没滚到第一个小标题时 active 为空，亮的是文档标题那一行
    let active=null;
    headings.forEach(heading=>{if(heading.getBoundingClientRect().top<=top)active=heading;});
    if(page.scrollTop+page.clientHeight>=page.scrollHeight-4){
      // 已经滚到底：最后一节永远够不着顶栏那条线，改认屏幕里最靠下的那一节
      headings.forEach(heading=>{if(heading.getBoundingClientRect().top<frame.bottom)active=heading;});
    }
    document.querySelectorAll(".doc-outline-link").forEach(link=>
      link.classList.toggle("on",!!active&&link.dataset.target===active.id));
    document.querySelector(".doc-reader-outline .doc-side-head")?.classList.toggle("on",!active);
  };
  if(page._docOutlineSpy)page.removeEventListener("scroll",page._docOutlineSpy);
  page._docOutlineSpy=sync;
  page.addEventListener("scroll",sync,{passive:true});
  sync();
}

function docDayDistance(value){
  const date=docParseTime(value);
  if(!date)return null;
  const startOfDay=input=>{const d=new Date(input);d.setHours(0,0,0,0);return d.getTime();};
  return Math.round((startOfDay(new Date())-startOfDay(date))/86400000);
}
function docTimeBucket(value){
  const days=docDayDistance(value);
  if(days===null)return "更早";
  if(days<=0)return "今天";
  if(days===1)return "昨天";
  if(days<7)return "本周";

function docVersionStamp(value,bucket){

}

function applyAgentStreamEvent(message,event){

  if(event.kind==="reply_delta"){message.text+=(event.delta||"");trace.current="正在生成回复";return;}
  if(event.kind==="work_delta"){const id=String(event.id||`work-${(trace.activity||[]).length}`);trace.activity=trace.activity||[];let item=trace.activity.find(entry=>entry.type==="text"&&entry.id===id);if(!item){item={type:"text",id,text:""};trace.activity.push(item);}item.text=item.text+(event.delta||"");trace.current="正在继续处理";return;}
  if(event.kind==="reasoning_delta"){trace.reasoning=(trace.reasoning+(event.delta||"")).slice(-4000);trace.current="正在思考";return;}
  if(event.kind==="plan_delta"){trace.plan=(trace.plan+(event.delta||"")).slice(-4000);trace.current="正在规划";return;}
  if(event.kind==="step"){
    if(!agentWorkStepVisible({label:event.label||"",stepKind:event.step_kind||""}))return;

  }

function employeeWorkContract(employee,skill){const source=skill||employeeRawSkills(employee)[0];if(!source)return {summary:'',usage:'',input:[],output:[],intake:[],results:[],actions:[],acceptance:[],packages:[],loading:false,error:''};const state=loadEmployeeDispatchContract(employee,source),data=state?.data;return {summary:source.summary||'',usage:'',input:data?dispatchSchemaFields(data.input_schema,'parameters'):[],output:data?dispatchSchemaFields(data.output_schema,'output'):[],intake:data?.assets||[],results:data?.deliverables||[],actions:[],acceptance:data?.acceptance_labels||[],packages:[],loading:!!state?.loading,error:state?.error||'',unpublished:!employee.active_release};}
const RESOURCE_HANDOFF_TYPES=[
  {id:"text",kind:"value",label:"文本"},
  {id:"number",kind:"value",label:"数字"},
  {id:"url",kind:"value",label:"链接"},
  {id:"boolean",kind:"value",label:"是/否"},
  {id:"date",kind:"value",label:"日期"},
  {id:"markdown",kind:"file",label:"Markdown",extensions:[".md",".markdown"]},
  {id:"word",kind:"file",label:"Word",extensions:[".doc",".docx"]},
  {id:"pdf",kind:"file",label:"PDF",extensions:[".pdf"]},
  {id:"image",kind:"file",label:"图片",extensions:[".png",".jpg",".jpeg",".gif",".webp",".svg"]},
  {id:"table",kind:"file",label:"表格",extensions:[".csv",".tsv",".xls",".xlsx"]},
  {id:"json",kind:"file",label:"JSON",extensions:[".json"]},
  {id:"txt",kind:"file",label:"TXT",extensions:[".txt",".log"]},
  {id:"folder",kind:"file",label:"文件夹"}
];
const RESOURCE_HANDOFF_BY_ID=Object.fromEntries(RESOURCE_HANDOFF_TYPES.map(item=>[item.id,item]));
const RESOURCE_HANDOFF_BY_EXT={};
RESOURCE_HANDOFF_TYPES.forEach(item=>(item.extensions||[]).forEach(ext=>{RESOURCE_HANDOFF_BY_EXT[ext]=item.id;}));
function resourceHandoffTypeLabel(type){return type==="file"?"文件":RESOURCE_HANDOFF_BY_ID[type]?.label||RESOURCE_HANDOFF_BY_ID.text.label;}
function resourceHandoffKind(type){return type==="file"?"file":RESOURCE_HANDOFF_BY_ID[type]?.kind||"";}
function resourceHandoffTypeFromName(value){
  const text=String(value||"").trim().toLowerCase();
  if(!text)return "";
  if(text==="folder"||text.endsWith("/"))return "folder";
  const match=text.match(/\.[a-z0-9]+$/);
  return match?RESOURCE_HANDOFF_BY_EXT[match[0]]||"":"";
}
function resourceHandoffTypeFromMime(value){
  const mime=String(value||"").toLowerCase();
  if(!mime)return "";
  if(mime==="inode/directory")return "folder";
  if(mime.startsWith("image/"))return "image";
  if(mime==="text/markdown"||mime==="text/x-markdown")return "markdown";
  if(mime==="application/pdf")return "pdf";
  if(mime==="application/json")return "json";
  if(mime==="text/plain")return "txt";
  if(mime==="text/csv"||mime.includes("spreadsheet")||mime.includes("excel"))return "table";
  if(mime.includes("wordprocessingml")||mime==="application/msword")return "word";
  return "";
}
function employeeWorkResourceTypeLabel(type){return resourceHandoffTypeLabel(type);}
function employeeWorkFileHint(value){
  const extensions=Object.keys(RESOURCE_HANDOFF_BY_EXT).map(ext=>ext.replace(".","\\.")).join("|");
  const match=String(value||"").match(new RegExp(`[A-Za-z0-9._-]+(?:${extensions})`,"i"));
  return match?match[0]:"";
}

function employeeWorkInputTopic(work){

  if(/机会/.test(text))return "已筛机会";

function employeeWorkResourceFromField(field){
  if(!field)return null;
  if(field.group==="acceptance"||field.group==="expected_output")return null;
  const blob=`${field.key||""} ${field.label||""} ${field.note||""}`;
  const file=employeeWorkFileHint(blob);
  const fromName=resourceHandoffTypeFromName(file||field.key||field.label||"");
  if(field.group==="deliverable")return {type:fromName||"markdown",name:file||field.label};
  if(field.type==="files"||field.group==="inputs"){
    if(/文件夹|目录|folder/.test(blob)&&!fromName)return {type:"folder",name:file||field.label||"文件夹"};
    const type=fromName||(file?"markdown":"");
    if(!type)return null;
    return {type,name:file||""};
  }
  if(field.type==="number")return {type:"number",name:field.label||""};
  if(field.type==="checkbox")return {type:"boolean",name:field.label||""};
  if(field.type==="date")return {type:"date",name:field.label||""};
  if(["select","list","object","textarea"].includes(String(field.type||"")))return null;
  if(/^(url|uri|link)$/i.test(field.key||"")||/(^|[^A-Za-z])url([^A-Za-z]|$)|链接/i.test(`${field.key||""} ${field.label||""}`))return {type:"url",name:field.label||""};

function employeeWorkListResources(work,side,options={}){
  const declared=side==="input"?(work.intake||[]):(work.output.filter(field=>field.group==="deliverable"&&field.handoffType).map(field=>({type:field.handoffType,name:employeeWorkFileHint(`${field.note||""} ${field.key||""}`)||field.label||"",required:field.required!==false})).concat(work.results||[]));
  if(declared.length){
    const seen=new Set();
    const items=declared.filter(item=>{const key=`${item.type}:${item.name||""}`;if(seen.has(key))return false;seen.add(key);return true;});
    return options.all?items:items.slice(0,3);
  }
  const fields=side==="input"?work.input:work.output;
  let items=fields.map(employeeWorkResourceFromField).filter(item=>item&&item.type);
  const files=items.filter(item=>resourceHandoffKind(item.type)==="file");
  if(files.length)items=files;
  else if(side==="input")items=[{type:"text",name:"工作对象"}];
  else items=items.filter(item=>resourceHandoffKind(item.type)==="file");
  const seen=new Set();
  items=items.filter(item=>{const key=`${item.type}:${item.name||""}`;if(seen.has(key))return false;seen.add(key);return true;});
  if(!items.length){
    const doc=work.output.find(field=>field.group==="deliverable");
    items=side==="input"?[{type:"text",name:"工作对象"}]:doc?[{type:resourceHandoffTypeFromName(doc.note||doc.key)||"markdown",name:employeeWorkFileHint(`${doc.note||""} ${doc.key||""}`)||doc.label||"交付物"}]:[{type:"text",name:"在对话里直接回复"}];
  }
  return options.all?items:items.slice(0,3);
}

      if(url.search||path.includes('\u0000'))return null;

    }

    if(/^\/documents\/(?:local-[a-f0-9]{32}|[a-z][a-z0-9]{7})\/?$/.test(local.pathname)||local.pathname==='/docs'&&/^[1-9][0-9]*$/.test(local.searchParams.get('document')||''))return {kind:'document',href:url.href};

async function pollChannelLogin(id){
